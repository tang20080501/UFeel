<!-- ufeel.css = 从 第一版ing.html 原样抽出的设计令牌，未经改动。
     stage.css = 新增的板块浮层系统，只叠加、不覆盖令牌。 -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#FAFBF9}
  body.dark{background:#241811}
  canvas{display:block;width:100vw;height:100vh;cursor:default}

  /* LOGO：固定在顶部居中，压在水面上但不吃鼠标事件 */
  #logo{
    position:fixed;
    left:50%;
    top:14vh;
    transform:translateX(-50%);
    z-index:5;                /* 水面之上、按钮之下 */
    width:260px;
    height:auto;
    pointer-events:none;      /* 鼠标穿透：不���响水面交互 */
    user-select:none;
    -webkit-user-drag:none;
    /* 原图是黑色字 + 透明底；深色模式用滤镜反色成白字 */
    filter:brightness(0);
    transition:filter .3s ease;
  }
  body.dark #logo{filter:invert(1) brightness(1.55) saturate(0);}

  #btn{
    position:fixed;top:20px;right:20px;z-index:9;
    width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(0,0,0,.18);
    background:rgba(255,255,255,.75);
    color:#3A3A38;cursor:pointer;font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:transform .2s ease, background .2s ease;
  }
  #btn:hover{transform:scale(1.08)}
  body.dark #btn{
    background:rgba(64,43,29,.75);
    border-color:rgba(226,190,150,.20);
    color:#E6D2BA;
  }
  @media (max-width:760px){
    #logo{width:180px}
  }

  /* ============================================================
     潮汐导航栏（只做浅色模式）
     ------------------------------------------------------------
     层级：水面 canvas(0) → LOGO(5) → 潮汐栏(6) → 明暗按钮(9)
     ============================================================ */
  #hot{
    position:fixed;
    left:0; top:0;
    height:100vh;
    width:25vw;              /* 由 JS 实时改写（1/6 ~ 1/4 屏之间律动） */
    overflow:hidden;         /* 裁掉超出当前宽度的浪尖 */
    z-index:6;
    /* 🔴 #hot 永远不吃鼠标。不能因为「进入热区要给按钮 hover」就整块开auto ——
       那样左1/5 屏的水面涟漪会被整片挡死。
       真正需要 pointer-events 的只有 #nav（按钮那一小条），单独在它身上开。 */
    pointer-events:none;
    transition:opacity .4s ease;
  }
  body.dark #hot{opacity:0;pointer-events:none !important}

  /* 潮汐画布自身永不捕获鼠标，由外层 #hot 负责。
     画布固定按最大宽度 25vw 分配像素，宽度律动交给 #hot 的 overflow 裁切 ——
     每帧改 canvas.width 会反复重分配画布内存，代价远大于一次裁切。 */
  #tide{
    position:absolute; left:0; top:0;
    width:25vw; height:100vh;
    pointer-events:none;
  }

  #nav{
    position:absolute; left:0; top:0;
    height:100%;
    padding-left:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;      /* 垂直居中 */
    gap:18px;
    opacity:0;
    pointer-events:none;
    transition:opacity .45s ease;
  }
  #hot.on #nav{opacity:1;pointer-events:auto}

  .nbtn{
    display:flex; align-items:center; gap:12px;
    background:none; border:0; padding:4px 6px 4px 0;
    font-family:"Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:17px; font-weight:400; line-height:1;
    color:#1A1A1A;
    cursor:pointer;
    transform-origin:left center;
    transition:transform .22s cubic-bezier(.2,.7,.3,1), color .22s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .nbtn .dot{
    width:11px; height:11px; border-radius:50%;
    background:#1A1A1A; flex:none;
    transition:background .22s ease, box-shadow .22s ease;
  }
  .nbtn:hover{transform:scale(1.2);color:#FFE9A8}
  .nbtn:hover .dot{
    background:#FFE9A8;
    box-shadow:0 0 12px 3px rgba(255,233,168,.85);
  }
  .nbtn:hover .txt{text-shadow:0 0 10px rgba(255,233,168,.75)}

  @media (max-width:760px){
    #nav{padding-left:26px;gap:14px}
    .nbtn{font-size:15px}
  }
</style>
<style>
/* ============================================================================
   UFEEL · 板块浮层系统
   ----------------------------------------------------------------------------
   这一份是新增的，ufeel.css（原样抽出的设计令牌）一个字都没动。
   规则：只叠加、不覆盖。所有新组件一律用下面这套变量，不再写死颜色。

   观感基调沿用原版的克制：无边框卡片、无阴影堆叠、细发丝线、大量留白。
   板块是「浮在水面上的一层薄雾」，不是盖在水上的一张纸 —— 所以面板左缘
   用渐变淡出，而不是切一条直角边。
   ========================================================================== */

:root{
  --font:"Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;

  --ink:#1A1A1A;                    /* 正文墨色 */
  --ink-2:rgba(26,26,26,.60);       /* 次级说明 */
  --ink-3:rgba(26,26,26,.34);       /* 眉标 / 占位 */
  --hair:rgba(26,26,26,.09);        /* 发丝线 */
  --hair-2:rgba(26,26,26,.05);

  --glow:#FFE9A8;                   /* 强调辉光，只在 hover / 激活时出现 */
  --glow-rgb:255,233,168;           /* 同上，给需要 alpha 的地方用 */
  --warn:#C8794A;                   /* 预警（夜间客服、风险提示） */
  --ok:#6E8F6B;

  --ease:cubic-bezier(.2,.7,.3,1);
}

body.dark{
  --ink:#E6D2BA;
  --ink-2:rgba(230,210,186,.60);
  --ink-3:rgba(230,210,186,.32);
  --hair:rgba(230,210,186,.13);
  --hair-2:rgba(230,210,186,.07);
  --warn:#D89A6A;
  --ok:#8FAE8B;
}

/* ============================================================
   1. 浮层容器
   ------------------------------------------------------------
   层级：canvas(0) → #stage(4) → #logo(5) → #hot 潮汐栏(6) → #btn(9)
   #stage 故意压在潮汐栏下面：左 1/4 屏永远留给导航，面板不去遮它。

   🔴 关闭时必须 pointer-events:none。原版注释里标过同样的坑 ——
      整块吃掉鼠标会让它覆盖范围内的水面涟漪全部失效。
   ============================================================ */
#stage{
  position:fixed; inset:0 0 0 25vw;
  z-index:4;
  pointer-events:none;
  /* 导航折叠时面板要跟着往左挪，拿到让出来的那块宽度 */
  transition:left .5s var(--ease);
}
#stage.open{pointer-events:auto}
body.staged.nav-fold #stage{left:22px}

.panel{
  position:absolute; inset:0;
  overflow-y:auto; overflow-x:hidden;
  overscroll-behavior:contain;
  padding:clamp(40px,7vh,84px) clamp(28px,5vw,72px) 96px clamp(36px,7vw,120px);

  font-family:var(--font);
  color:var(--ink);
  font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;

  /* 左缘淡出：水面在面板底下仍然看得见，交界处是雾不是刀切 */
  background:linear-gradient(100deg,
    rgba(250,251,249,0) 0%,
    rgba(250,251,249,.62) 13%,
    rgba(250,251,249,.86) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(1.08);
  backdrop-filter:blur(22px) saturate(1.08);

  opacity:0;
  transform:translateY(10px);
  transition:opacity .4s ease, transform .5s var(--ease);
}
body.dark .panel{
  background:linear-gradient(100deg,
    rgba(36,24,17,0) 0%,
    rgba(36,24,17,.66) 13%,
    rgba(36,24,17,.90) 100%);
}
.panel.in{opacity:1; transform:none}

/* 面板打开时 LOGO 让位：它本来压在正中，会跟正文标题打架 */
#logo{transition:filter .3s ease, opacity .35s ease}
body.staged #logo{opacity:0}

/* 有板块打开时把潮汐栏钉住。
   否则指针一离开左 1/4 屏，water.js 的 tideExit() 就把导航收了，
   用户进到板块里就再也看不见能切到哪儿去。 */
body.staged #nav{opacity:1; pointer-events:auto}

/* 深色模式原本整条 #hot 是 opacity:0（原版注明「潮汐栏只做浅色模式」）。
   板块打开时必须把导航露出来，否则深色下进了板块就切不走。
   只露按钮那一列，潮汐画布本身仍然藏起来 —— 深色那套渲染的是丝绸，
   底下一层浅色波浪配不上。 */
body.staged.dark #hot{opacity:1}
body.staged.dark #tide{display:none}
body.staged.dark .nbtn{color:var(--ink)}
body.staged.dark .nbtn .dot{background:var(--ink)}

/* ============================================================
   潮汐栏折叠 —— 原地压成左边缘一条细片
   ------------------------------------------------------------
   🔴 这里必须用 transform，不能用 width。
      #hot 的宽度被 water.js 每帧改写（1/6 ~ 1/4 屏之间律动），
      用 width 去折叠会在下一帧就被它改回去，变成一条抖动的橡皮筋。
      transform 不参与布局，两边各管各的，不会打架；
      transform-origin 放在左边缘，压缩后自然贴住左边而不是居中缩成一团。

   折叠后 #nav 要显式收掉：它是 #hot 的子节点，会被一起压扁，
   不收的话会留下几道被压成竖线的文字残影。
   选择器带上 #hot 是为了压过 ufeel.css 里 #hot.on #nav 的那条 ID 规则 ——
   指针扫过左 1/4 屏时 water.js 会给 #hot 加 .on，不加这一层就折叠不掉。
   ============================================================ */
#hot{transition:opacity .4s ease, transform .5s var(--ease); transform-origin:left center}

body.staged.nav-fold #hot{transform:scaleX(.06)}
body.staged.nav-fold #hot #nav{opacity:0; pointer-events:none}

/* 细片上的把手。刻意做成和导航按钮同一套点状motif ——
   一眼能读出「导航被压到这里了」，而不是一条不知道干什么的竖线。 */
#navhandle{
  position:fixed; left:0; top:50%; z-index:7;
  width:10px; height:86px;
  padding:0; border:0; border-radius:0 9px 9px 0;
  background:rgba(26,26,26,.13);
  color:var(--ink);
  cursor:pointer;
  opacity:0; pointer-events:none;
  transform:translate(-100%, -50%);
  transition:opacity .3s ease .18s, transform .5s var(--ease) .1s,
             width .22s var(--ease), background .22s ease, box-shadow .22s ease;
}
body.staged.nav-fold #navhandle{
  opacity:1; pointer-events:auto; transform:translate(0, -50%);
}
body.dark #navhandle{background:rgba(230,210,186,.18)}

/* 三个点，和导航按钮前面的 ● 是同一个语汇 */
#navhandle::before{
  content:''; position:absolute; left:50%; top:50%;
  width:3px; height:3px; border-radius:50%;
  background:currentColor; opacity:.5;
  transform:translate(-50%, -50%);
  box-shadow:0 -9px 0 currentColor, 0 9px 0 currentColor;
}
#navhandle:hover{
  width:15px;
  background:rgba(255,233,168,.8);
  box-shadow:0 0 18px 3px rgba(255,233,168,.5);
}
#navhandle:hover::before{opacity:.85}
#navhandle:focus-visible{
  outline:none; width:15px;
  background:rgba(255,233,168,.8);
  box-shadow:0 0 18px 3px rgba(255,233,168,.5);
}

/* 细滚动条：不抢戏，但让「还能往下翻」这件事可被察觉 */
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-thumb{
  background:var(--hair); border-radius:9px;
  border:3px solid transparent; background-clip:content-box;
}
.panel::-webkit-scrollbar-thumb:hover{background:var(--ink-3); background-clip:content-box}

/* ============================================================
   2. 页眉
   ============================================================ */
.ph{max-width:660px; margin-bottom:clamp(30px,5vh,52px)}

.ph-eyebrow{
  margin:0 0 14px;
  font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400;
}
.ph-title{
  margin:0 0 16px;
  font-size:clamp(26px,3.6vw,38px);
  font-weight:300; letter-spacing:.06em; line-height:1.3;
}
.ph-note{
  margin:0; max-width:52ch;
  font-size:14px; line-height:1.85; color:var(--ink-2);
}

/* 回到水面。样式照着 #btn（明暗按钮）来，只是往左挪一格，两个圆钮并排。
   🔴 不能用「面板里的绝对定位按钮」来实现：
      .panel 是滚动容器，absolute 子元素跟着内容一起滚 ——
      往下翻两屏按钮就出视野了，想退出只剩 Esc 一条路。
      固定在视口上才是「任何时候都在」。 */
#home{
  position:fixed; top:20px; right:70px; z-index:9;
  width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(0,0,0,.18);
  background:rgba(255,255,255,.75);
  color:#3A3A38; cursor:pointer; font-size:17px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  opacity:0; pointer-events:none; transform:translateX(8px);
  transition:opacity .3s ease, transform .35s var(--ease),
             color .2s ease, border-color .2s ease, box-shadow .2s ease;
}
body.staged #home{opacity:1; pointer-events:auto; transform:none}
body.dark #home{
  background:rgba(64,43,29,.75);
  border-color:rgba(226,190,150,.20);
  color:#E6D2BA;
}
#home:hover{
  transform:scale(1.08); color:var(--glow);
  border-color:rgba(var(--glow-rgb),.5);
  box-shadow:0 0 14px 2px rgba(var(--glow-rgb),.4);
}

/* ============================================================
   3. 通用块
   ============================================================ */
.sec{max-width:760px; margin-bottom:clamp(30px,5vh,46px)}
.sec-h{
  margin:0 0 16px;
  font-size:12px; letter-spacing:.2em; color:var(--ink-3); font-weight:400;
}

/* pre-wrap：空状态的文案是有意断行的（先说什么、再补一句），
   不设这个的话换行会被折叠成一段，读起来就变成絮叨的长句。 */
.empty{
  max-width:52ch; padding:26px 0;
  color:var(--ink-3); font-size:14px; line-height:1.9;
  white-space:pre-wrap;
}

/* 加载骨架：只在真的等后端时出现，比转圈更安静 */
.skel{
  height:14px; border-radius:7px; background:var(--hair-2);
  animation:breathe 1.8s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}

/* ============================================================
   4. 分组卡片 —— 没有边框、没有阴影，只有一层比面板稍亮的底
   ============================================================ */
.card{
  padding:20px 22px; border-radius:16px;
  background:rgba(255,255,255,.42);
  border:1px solid var(--hair-2);
  transition:background .3s ease, border-color .3s ease;
}
body.dark .card{background:rgba(226,190,150,.05)}

/* ============================================================
   5. 标签 / 心情
   ============================================================ */
.chip{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 15px; border-radius:999px;
  border:1px solid var(--hair); background:transparent;
  font-family:var(--font); font-size:13px; color:var(--ink-2);
  cursor:pointer;
  transition:color .22s ease, border-color .22s ease, background .22s ease, transform .22s var(--ease);
}
.chip:hover{transform:translateY(-1px); color:var(--ink); border-color:var(--ink-3)}
.chip.on{
  color:var(--ink); border-color:rgba(255,233,168,.55);
  background:rgba(255,233,168,.13);
}
body.dark .chip.on{background:rgba(255,233,168,.10)}

.chips{display:flex; flex-wrap:wrap; gap:9px}

/* 心情圆点：颜色不表好坏，只表不同 —— 不预设哪种情绪是「负面」的 */
.mdot{
  width:11px; height:11px; border-radius:50%; flex:none;
  box-shadow:inset 0 0 0 1px var(--hair);
}

/* ============================================================
   6. 按钮
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:9px;
  padding:11px 24px; border-radius:999px;
  border:1px solid var(--hair); background:transparent; color:var(--ink);
  font-family:var(--font); font-size:14px; letter-spacing:.04em;
  cursor:pointer;
  transition:transform .22s var(--ease), border-color .22s ease,
             background .22s ease, box-shadow .22s ease, color .22s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{
  transform:translateY(-1px);
  border-color:rgba(255,233,168,.6);
  box-shadow:0 0 16px 1px rgba(255,233,168,.32);
  color:var(--ink);
}
.btn.primary{
  border-color:transparent;
  background:rgba(255,233,168,.30); color:var(--ink);
}
body.dark .btn.primary{background:rgba(255,233,168,.20)}
.btn.primary:hover{box-shadow:0 0 22px 2px rgba(255,233,168,.45)}

/* 🔴 禁用态不许写成「灰掉了事」——
   积分不足时按钮置灰，但必须靠旁边的说明文字讲清楚「什么还能用」。 */
.btn[disabled]{
  opacity:.38; cursor:not-allowed; transform:none;
  border-color:var(--hair); box-shadow:none;
}

/* ============================================================
   7. 表单
   ============================================================ */
.field{display:block; margin-bottom:18px}
.field-l{
  display:block; margin-bottom:9px;
  font-size:12px; letter-spacing:.16em; color:var(--ink-3);
}
.ta, .inp{
  width:100%; box-sizing:border-box;
  padding:14px 16px; border-radius:14px;
  border:1px solid var(--hair);
  background:rgba(255,255,255,.34);
  color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.8;
  resize:vertical;
  transition:border-color .25s ease, background .25s ease, box-shadow .25s ease;
}
body.dark .ta, body.dark .inp{background:rgba(226,190,150,.05)}
.ta:focus, .inp:focus{
  outline:none; border-color:rgba(255,233,168,.6);
  box-shadow:0 0 0 3px rgba(255,233,168,.14);
}
.ta::placeholder, .inp::placeholder{color:var(--ink-3)}
.ta{min-height:132px}

.counter{
  display:block; margin-top:7px; text-align:right;
  font-size:12px; color:var(--ink-3);
}
.counter.over{color:var(--warn)}

.field-hint{margin:9px 0 0; font-size:12.5px; line-height:1.7; color:var(--ink-3)}

.row-acts{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:20px}

/* ============================================================
   8. 开关
   ============================================================ */
.row{
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:17px 0; border-bottom:1px solid var(--hair-2);
}
.row:last-child{border-bottom:0}
.row-l{min-width:0}
.row-t{font-size:14.5px; line-height:1.6}
.row-d{margin:5px 0 0; font-size:12.5px; line-height:1.7; color:var(--ink-3); max-width:46ch}
.row-r{flex:none}

.sw{
  position:relative; width:44px; height:25px; border-radius:999px;
  border:1px solid var(--hair); background:transparent;
  cursor:pointer; padding:0; flex:none;
  transition:background .28s ease, border-color .28s ease;
}
.sw::after{
  content:''; position:absolute; top:3px; left:3px;
  width:17px; height:17px; border-radius:50%;
  background:var(--ink-3);
  transition:transform .28s var(--ease), background .28s ease;
}
.sw.on{background:rgba(255,233,168,.28); border-color:rgba(255,233,168,.5)}
.sw.on::after{transform:translateX(19px); background:var(--ink)}

/* ============================================================
   9. 数字格
   ============================================================ */
.stats{
  display:grid; gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  max-width:760px; margin-bottom:clamp(30px,5vh,46px);
}
.stat{padding:20px 22px; border-radius:16px; background:rgba(255,255,255,.36); border:1px solid var(--hair-2)}
body.dark .stat{background:rgba(226,190,150,.05)}
.stat-n{font-size:30px; font-weight:300; letter-spacing:.02em; line-height:1.2}
.stat-u{font-size:14px; color:var(--ink-3); margin-left:3px}
.stat-l{margin-top:7px; font-size:12px; letter-spacing:.14em; color:var(--ink-3)}

/* ============================================================
   10. 情绪曲线
   ============================================================ */
.curve{
  max-width:760px; padding:24px 22px 18px; border-radius:18px;
  background:rgba(255,255,255,.34); border:1px solid var(--hair-2);
}
body.dark .curve{background:rgba(226,190,150,.05)}
.curve svg{display:block; width:100%; height:auto; overflow:visible}
.curve-x{
  display:flex; justify-content:space-between;
  margin-top:12px; font-size:11.5px; letter-spacing:.1em; color:var(--ink-3);
}

/* ============================================================
   11. 手账 · 心事储存罐
   ------------------------------------------------------------
   罐子画成一个玻璃容器：罐口一条高光，罐身里是封存的心事（光点）。
   心愿是「看得见自己攒了多少」，所以点数按真实条数走。
   ============================================================ */
.jar-wrap{display:flex; gap:clamp(26px,5vw,54px); align-items:flex-start; flex-wrap:wrap}

.jar{
  flex:none; width:180px; height:236px;
  position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding-bottom:14px;
}
.jar-mouth{
  width:74px; height:13px; border-radius:7px 7px 3px 3px;
  border:1px solid var(--hair); border-bottom:0;
  background:rgba(255,255,255,.42);
}
body.dark .jar-mouth{background:rgba(226,190,150,.08)}
.jar-body{
  position:relative; width:164px; height:196px;
  border:1px solid var(--hair); border-radius:16px 16px 26px 26px;
  background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.12));
  overflow:hidden;
  display:flex; flex-wrap:wrap-reverse; align-content:flex-start;
  gap:7px; padding:14px 13px;
  box-shadow:inset 0 0 30px rgba(255,255,255,.35);
}
body.dark .jar-body{
  background:linear-gradient(180deg, rgba(226,190,150,.07), rgba(226,190,150,.03));
  box-shadow:inset 0 0 30px rgba(226,190,150,.05);
}
/* 罐口那一道竖向高光：玻璃感全靠它 */
.jar-body::after{
  content:''; position:absolute; top:0; left:16px;
  width:11px; height:100%;
  background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0));
  opacity:.5; pointer-events:none;
}
body.dark .jar-body::after{background:linear-gradient(180deg, rgba(230,210,186,.4), rgba(230,210,186,0))}

.bead{
  width:13px; height:13px; border-radius:50%;
  background:rgba(255,233,168,.72);
  box-shadow:0 0 8px 1px rgba(255,233,168,.5);
  animation:beadin .5s var(--ease) both;
}
@keyframes beadin{from{opacity:0; transform:translateY(-14px) scale(.5)}to{opacity:1; transform:none}}
.jar-cap{margin-top:11px; font-size:12px; letter-spacing:.12em; color:var(--ink-3)}

.dlist{flex:1; min-width:260px; display:flex; flex-direction:column; gap:2px}
.ditem{
  padding:17px 4px; border-bottom:1px solid var(--hair-2);
  display:flex; gap:16px; align-items:flex-start;
}
.ditem-l{flex:none; padding-top:5px; display:flex; flex-direction:column; align-items:center; gap:8px}
.ditem-b{flex:1; min-width:0}
.ditem-t{
  font-size:14.5px; line-height:1.8; white-space:pre-wrap; word-break:break-word;
  margin:0;
}
.ditem-m{
  margin:9px 0 0; display:flex; flex-wrap:wrap; gap:9px; align-items:center;
  font-size:12px; color:var(--ink-3);
}
.ditem-acts{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap}
.linkish{
  background:none; border:0; padding:0;
  font-family:var(--font); font-size:12px; color:var(--ink-3);
  cursor:pointer; border-bottom:1px solid transparent;
  transition:color .2s ease, border-color .2s ease;
}
.linkish:hover{color:var(--ink); border-bottom-color:var(--hair)}

/* ============================================================
   12. 找人聊 · 对话
   ------------------------------------------------------------
   气泡不用实心块，用「一层比水面稍亮的雾」，和面板同一套语言。
   ============================================================ */
.chat{
  display:flex; flex-direction:column; gap:22px;
  max-width:720px; padding-bottom:20px;
}
.bub{max-width:86%; animation:bubin .45s var(--ease) both}
@keyframes bubin{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

.bub-who{
  font-size:11.5px; letter-spacing:.18em; color:var(--ink-3);
  margin-bottom:8px;
}
.bub-t{
  margin:0; white-space:pre-wrap; word-break:break-word;
  font-size:15px; line-height:1.95;
}
.bub.ai .bub-t{color:var(--ink)}
.bub.me{align-self:flex-end; text-align:right}
.bub.me .bub-t{color:var(--ink-2)}

/* AI 正在逐字输出时的光标：一条呼吸的细线，不是跳动的方块 */
.caret{

/* 系统提示（脱敏拦截 / 风险预警）：不伪装成 AI 说的话，单独一种样式 */

/* 深度模式：多视角并行 —— 基础陪伴之外的另一条路，不是升级 */

.lessons{display:flex; flex-direction:column; gap:12px; max-width:760px}

/* ============================================================
   15. 设置
   ============================================================ */
.ledger{max-width:760px}

}

.plan-note li{font-size:13px; line-height:1.9; color:var(--ink-2); margin-bottom:7px}

/* ============================================================
   15.5 启动失败提示（noscript / 看门狗）
   ------------------------------------------------------------
   🔴 这块样式刻意写得保守：不用 inset、不用 clamp、不用 CSS 变量。
   它的存在意义就是「别的东西都坏了它还得在」，用上新特性等于
   在最需要它的内核上把它自己也弄坏 —— 那才是最讽刺的失败。
   ============================================================ */
.boot{
  position:fixed; top:0; right:0; bottom:0; left:0;
  z-index:100;
  box-sizing:border-box;
  padding:9vh 8vw;
  display:flex; flex-direction:column; justify-content:center;
  background:#FAFBF9;
  font-family:"Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color:#1A1A1A;
  font-size:15px; line-height:1.9;
  overflow-y:auto;
}
body.dark .boot{background:#241811; color:#E6D2BA}
/* 🔴 这一条不能省。
   hidden 属性靠的是 UA 样式表里的 [hidden]{display:none}，
   而作者样式优先于 UA 样式 —— 上面 .boot 一旦写了 display:flex，
   hidden 就彻底失效，提示块会永远盖在页面上，整个应用看起来
   就是「没能启动」（而它其实好好地跑在下面）。
   这个坑很隐蔽：DOM 里 hidden 属性还在，只看标记是发现不了的。 */
.boot[hidden]{display:none}

/* 聊天软件内置预览的提示条。
   和 .boot 同样保守（不用 inset / clamp / CSS 变量），理由也一样：
   它出现的场景就是「环境不正常」，用上新特性等于在最需要它的内核上
   把它自己弄坏。 */
#chatwarn{
  position:fixed; top:0; right:0; left:0;
  z-index:110;
  box-sizing:border-box;
  padding:14px 18px 15px;
  background:#FFF6E0;
  border-bottom:1px solid #E8D9B0;
  font-family:"Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color:#3A3020;
  font-size:13px; line-height:1.7;
  text-align:center;
  /* 🔴 纯 CSS 淡出，不能用 JS 定时器：这条提示出现的场景本身就可能是
     「触摸事件收不到」，一个需要点击才能关掉的提示在那时候是关不掉的。
     末尾带上 visibility:hidden —— 只把 opacity 归零的话，
     它仍然占着顶部那条位置继续吃点击。 */
  animation:cw-out .9s ease 16s forwards;
}
#chatwarn[hidden]{display:none}
.cw-t{margin:0 0 5px; font-size:14px; font-weight:700}
.cw-d{margin:0; color:#6A5A3A}
.cw-d b{color:#3A3020; font-weight:700}
@keyframes cw-out{ to{ opacity:0; visibility:hidden } }

.boot > *{max-width:34em; margin-left:auto; margin-right:auto; width:100%}
.boot-t{
  margin:0 0 18px;
  font-size:21px; font-weight:400; letter-spacing:.06em;
}
.boot-d{margin:0 0 14px; font-size:14px; color:#5A5A58}
body.dark .boot-d{color:#B8A694}
.boot-d b{font-weight:700; color:#1A1A1A}
body.dark .boot-d b{color:#E6D2BA}
.boot-dim{color:#8A8A88; font-size:12.5px; margin-top:26px}
body.dark .boot-dim{color:#8A7A6A}
.boot-msg{word-break:break-word}

/* ============================================================
   16. 提示条
   ============================================================ */
.toast{
  position:fixed; left:50%; bottom:38px; transform:translate(-50%,14px);
  z-index:20;
  padding:12px 22px; border-radius:999px;
  border:1px solid var(--hair);
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  color:var(--ink); font-family:var(--font); font-size:13.5px;
  opacity:0; pointer-events:none;
  transition:opacity .3s ease, transform .4s var(--ease);
}
body.dark .toast{background:rgba(64,43,29,.88)}
.toast.in{opacity:1; transform:translate(-50%,0)}

/* ============================================================
   17. 响应式
   ------------------------------------------------------------
   窄屏下面板铺满，潮汐栏浮在面板之上 ——
   点击热区展开/收起由原版 water.js 负责，不在这里重复实现。
   ============================================================ */
@media (max-width:760px){
  #stage{inset:0}
  /* 窄屏面板本来就该铺满。折叠时让出的那 22px 在这里只会白白切掉一条边，
     而且潮汐栏是浮在面板之上的 —— 折叠与否都不占布局宽度。 */
  body.staged.nav-fold #stage{left:0}
  .panel{padding:76px 22px 90px}
  .panel::-webkit-scrollbar{width:0}
  #home{top:16px; right:64px}
  .bub{max-width:94%}
  .jar{width:150px}
  .jar-body{width:136px; height:168px}
  .lesson-b{padding-left:24px}

  /* 罐子和心事列表在窄屏上改成竖排。
     横排的最小宽度是 150(罐) + 26(间距) + 260(列表的 min-width) = 436px，
     而 390px 的手机留给面板内容的只有 337px —— 靠 .jar-wrap 上的
     flex-wrap:wrap 兜住了（列表会换到第二行），并不会溢出。

     这里显式写成 column，是为了不依赖 wrap 的间接结果：
     两者视觉上一样，但换行版本的留白和顺序取决于各自的 min-width，
     以后谁把 .jar 或 .dlist 的宽度调一调，换行位置就可能跳到别处去。
     顺手把 .dlist 的 min-width 归零 —— 它本来就是为横排设的下限，
     竖排下还留着只会在更窄的屏上重新变成溢出。 */
  .jar-wrap{flex-direction:column; gap:26px}
  .dlist{min-width:0; width:100%}

  /* 🔴 手机上导航会被切掉一半，这里必须让 #nav 跳出 #hot 的裁切框。
     #hot 的宽度被 water.js 压到 1/6~1/5 屏（390px 的屏上只有 65~78px），
     而 #hot 带 overflow:hidden —— 「找人聊」这三个字根本放不下。
     改成 position:fixed 就脱离了那个裁切框：
     #hot 平时没有 transform，不会成为 fixed 元素的包含块，裁不到它。
     （折叠态下 #hot 有 transform 会重新成为包含块，但那时 #nav 本来就不显示。） */
  #nav{position:fixed; left:0; top:0; height:100%; padding-left:22px}
}

/* ============================================================
   触屏：没有 hover，潮汐栏不会自己冒出来
   ------------------------------------------------------------
   桌面端靠「指针移到左侧 1/4 屏」展开导航。触屏没有 hover，
   如果不在屏幕上留一个看得见的入口，用户根本不知道这里能点 ——
   表现就是「点了没反应」。所以把手常驻。

   它同时也承担「导航收起来了」这个语义：导航一旦露出来就把把手收回去。

   条件写成「没有 hover 的能力」**或**「窄屏」取或：
   触屏设备本身就没有 hover；而窄屏即便带鼠标（桌面把窗口拖窄、
   或者带触摸屏的笔记本）也一样够不着「把指针移到左边」这个动作。
   两个条件分开写而不是只写前者，是因为前者没法在无头环境里验证 ——
   窄屏这条至少能在固定视口下截图确认。
   ============================================================ */
@media (hover: none), (max-width:760px){
  #navhandle{
    opacity:1; pointer-events:auto;
    transform:translate(0, -50%);
  }
  /* 🔴 判断条件必须是「导航真的显示着」，不能是「鼠标在左侧」。
     #hot.on 是 water.js 按**指针位置**加的类：指针一进左 1/4 屏它就亮，
     而把手正好就住在那个位置 —— 直接写 #hot.on ~ #navhandle 的话，
     鼠标一靠近把手，把手就把自己藏了，连 pointer-events 一起变成 none，
     等于「你越想点它，它越跑」。必须再叠一层 not(nav-fold)：
     折叠态下 #hot.on 并不表示导航可见（导航被上面的规则压着不显示）。 */
  body.staged:not(.nav-fold) #navhandle,
  body:not(.nav-fold) #hot.on ~ #navhandle{
    opacity:0; pointer-events:none;
    transform:translate(-100%, -50%);
  }
}

/* ------------------------------------------------------------
   触摸手势
   #c 占满全屏，是拖动出水波的那块面。
   touch-action:pinch-zoom 表示「单指手势浏览器不要管，交给页面；
   双指缩放仍然保留」—— 用 none 会把缩放一并禁掉，那样的取舍不划算。
   按钮上用 manipulation 是为了去掉移动端那 300ms 的双击缩放等待。 */
#c{touch-action:pinch-zoom}
button, .chip, .nbtn, #navhandle, #btn{touch-action:manipulation}

/* 尊重系统的减少动效设置 */
@media (prefers-reduced-motion:reduce){
  .panel, .bub, .bead, .toast{animation:none !important; transition-duration:.01ms !important}
  .panel{opacity:1; transform:none}
}
</style>
</head>
<body>

<!-- ============================================================
     开不了的时候，一定要说话
     ------------------------------------------------------------
     这个页面完全由 JS 渲染。如果脚本被拦掉，用户看到的是一张
     白纸加一个 logo —— 只会得出「点了没反应」这一个结论，
     而真正的原因（浏览器执行了 HTML 和 CSS，却没执行 JS）
     他无从得知。

     下面两条把这种情况变成一句能照着做的话：
       noscript  —— 脚本被整个禁用时显示（我们自己的脚本也不会跑）
       看门狗    —— 脚本跑了但中途报错时显示
     两者互补，覆盖的都是「必须由页面自己说出来」的故障。
     ============================================================ -->
<noscript>
  <div class="boot">
    <h1 class="boot-t">这个页面需要 JavaScript</h1>
    <p class="boot-d">你正在用的多半是聊天软件自带的预览窗口 —— 它显示了页面，
      但没有执行页面里的脚本，所以看起来是一张点不动的白纸。</p>
    <p class="boot-d"><b>安卓</b>：右上角「···」→ 用其他应用打开 → 选浏览器<br>
      <b>iPhone</b>：右上角「···」→ 用其他应用打开 → Safari</p>
    <p class="boot-d boot-dim">也可以让发文件的人直接用浏览器打开试试，先确认文件本身没问题。</p>
  </div>
</noscript>

<!-- 看门狗用的提示块。
     🔴 必须排在下面那段看门狗脚本**前面**：报错监听器一触发就要去
     查这个元素，晚一行就查不到，于是整个兜底静默失效 ——
     兜底最常见的失败方式，就是它自己也需要一个已经存在的锚点。 -->
<div id="boot-error" class="boot" hidden>
  <h1 class="boot-t">页面没能启动</h1>
  <p class="boot-d">脚本被拦住了，或者中途出错。用系统浏览器打开就能正常使用：</p>
  <p class="boot-d"><b>安卓</b>：右上角「···」→ 用其他应用打开 → 选浏览器<br>
    <b>iPhone</b>：右上角「···」→ 用其他应用打开 → Safari</p>
  <p class="boot-d boot-dim">错误信息：<span class="boot-msg">（页面没有报告具体原因）</span></p>
</div>

<script>
/* 启动看门狗：排在所有脚本前面，所以无论后面哪个脚本抛错、还是内核
   把脚本整个拦掉，它都能兜住。4 秒还没等到启动完成的信号，就把话说清楚。 */
(function(){
  var timer = setTimeout(show, 4000);

  function show(msg){
    var el = document.getElementById('boot-error');
    if(!el || !el.hidden) return;
    if(msg){
      var m = el.querySelector('.boot-msg');
      if(m) m.textContent = msg;
    }
    el.hidden = false;
  }

  /* 应用起来了 —— 说明刚才即使报过错也不致命。
     把提示收回去，但留一条日志：一个「看着正常、其实报过错」的状态最坑人，
     下次出问题会从完全无关的地方开始查。 */
  window.__UFEEL_BOOT__ = function(){
    clearTimeout(timer);
    var el = document.getElementById('boot-error');
    if(el && !el.hidden){
      el.hidden = true;
      console.warn('[UFeel] 启动过程中报过错，但应用仍然起来了 —— 刚才那条可能不致命。');
    }
  };

  /* 报错就立刻亮出来，不用干等 4 秒。
     这里只报告，不做任何恢复 —— 一个已经抛错的页面继续跑下去，
     表现只会更怪。 */
  window.addEventListener('error', function(e){
    show(e && e.message ? e.message : null);
  });
})();
</script>

<!-- 聊天软件内置预览的提示条。
     noscript 管的是「脚本没跑」，这一条管的是「脚本跑了但触摸收不到」——
     后者在 noscript 下不会出现（脚本是活的），用户却同样点不动，
     而且没有任何线索。所以按 UA 认一下 QQ/微信的内置浏览器，
     认出就直接把话说出来。

     🔴 必须纯 CSS 自动淡出，不能用 JS 定时器：
     这条提示存在的场景本身就可能是「事件收不到」，一个需要点击才能
     关掉的提示，在那时候是关不掉的。 -->
<div id="chatwarn" hidden>
  <p class="cw-t">在聊天软件里打开，可能点不动</p>
  <p class="cw-d">右上角「···」→ 用其他应用打开 → <b>安卓选浏览器，iPhone 选 Safari</b></p>
</div>

<script>
/* 认内置浏览器。QQ 的文件预览在安卓上是 X5 内核，UA 里带 QQ/ 或 MQQBrowser；
   微信带 MicroMessenger。认出来且是本地文件，就把提示条露出来。
   判断放在这里而不是 shell.js：shell.js 要等十几个脚本加载完，
   而这条提示越早出现越好。 */
(function(){
  var ua = navigator.userAgent || '';
  if(!/QQ\/|MQQBrowser|QQBrowser|MicroMessenger/i.test(ua)) return;
  if(location.protocol !== 'file:') return;
  var el = document.getElementById('chatwarn');
  if(el) el.hidden = false;
})();
</script>

<!-- 触摸兼容层：必须排在 water.js 前面。
     老内核（QQ/微信自带的 X5、iOS 13 以下的 WKWebView）没有 Pointer Events，
     没有它的话点屏幕不会有涟漪、潮汐栏也永远不展开。
     支持 Pointer Events 的浏览器里它直接 return，什么都不做。 -->
<script>
/* ============================================================================
   UFEEL · 触摸兼容层
   ----------------------------------------------------------------------------
   水面的涟漪和潮汐栏的展开，全部挂在 Pointer Events 上
   （pointerdown / pointermove / pointerleave）。桌面和现代浏览器没问题，
   但**在 QQ / 微信里点开本地 HTML 时用的是各家自己的内核**
   （安卓是 X5/TBS，iOS 是 WKWebView），其中一批版本压根没有 Pointer Events：

     内核太老 / 系统太老  →  window.PointerEvent 为 undefined
     于是                  →  点屏幕没有涟漪
                             左侧潮汐栏也永远不展开
                             整个页面像死的一样

   这里做降级：没有 PointerEvent 时，把 touch 事件翻译成同名的 pointer 事件
   再派发出去。派发的是普通 Event，额外挂上 clientX / clientY ——
   正好是 water.js 用到的全部字段。它是冒泡的，
   所以挂在 window 上的那次「鼠标在没在左 1/4 屏」的判断也能收到。

   这样 water.js 一行都不用改：它只管收 pointer 事件，不关心是谁发的。
   支持 Pointer Events 的浏览器（绝大多数）在这里直接 return，零开销、零影响。
   ========================================================================== */
(function(){
  'use strict';

  if(window.PointerEvent) return;

  /* pointerenter / pointerleave 按规范不冒泡。
     不冒泡这点必须还原 —— water.js 在 #c 上单独听 pointerleave 来复位
     lastX/lastY，如果它冒泡到 window，会顺带触发热区的重复判断。 */
  const NO_BUBBLE = { pointerenter:1, pointerleave:1 };

  function makeEvent(type, t){
    const ev = new Event(type, {
      bubbles:    !NO_BUBBLE[type],
      cancelable: true
    });
    /* water.js 只读 clientX / clientY 这两个；
       其余按 PointerEvent 的形状补齐，免得以后有人加了读别的字段的代码，
       在兼容层下悄悄拿到 undefined。 */
    ev.clientX   = t.clientX;
    ev.clientY   = t.clientY;
    ev.pageX     = t.pageX;
    ev.pageY     = t.pageY;
    ev.screenX   = t.screenX;
    ev.screenY   = t.screenY;
    ev.pointerId = t.identifier;
    ev.pointerType = 'touch';
    ev.isPrimary = true;
    ev.buttons   = (type === 'pointerup' || type === 'pointerleave') ? 0 : 1;
    ev.pressure  = ev.buttons ? 0.5 : 0;
    return ev;
  }

  const MAP = {
    touchstart:  ['pointerdown'],
    touchmove:   ['pointermove'],
    /* touchend 要同时补 pointerup 和 pointerleave：
       pointerup 是语义上对应的那个，而 water.js 实际用的是 pointerleave
       来复位拖动状态（lastX = null）。只补一个就会留下一个拖到一半的残影。 */
    touchend:    ['pointerup', 'pointerleave'],
    touchcancel: ['pointerup', 'pointerleave']
  };

  function translate(e){
    const t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    const target = e.target;
    if(!target || !target.dispatchEvent) return;

    const types = MAP[e.type];
    for(let i = 0; i < types.length; i++){
      /* 单个派发失败不该连累后面的 —— 这里出错的表现是「整块交互失灵」，
         没有任何提示，排查起来非常费劲，所以宁可咽掉。 */
      try{ target.dispatchEvent(makeEvent(types[i], t)); }catch(err){}
    }
  }

  for(const src in MAP){
    /* passive：这里只做转发，不拦截，浏览器不用为「可能会 preventDefault」
       付出等一个监听器返回的代价，滚动和点击的响应更快。 */
    window.addEventListener(src, translate, { passive:true });
  }

  /* 记一笔，方便排查。在控制台能一眼看出当前是不是走的兼容层。 */
  window.__UFEEL_TOUCH_COMPAT__ = true;
  console.info('[UFeel] 当前内核不支持 Pointer Events，已启用触摸兼容层。');
})();
</script>

<!-- 水面/丝绸渲染：从 第一版ing.html 逐字搬运，未改一行。
     它自带 window 级指针热区 + #btn 明暗切换，因此必须最先加载。 -->
<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');

let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  cvs.width  = W * DPR;
  cvs.height = H * DPR;
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildSurface();
  buildField();     // 高度场跟随画布尺寸重建
  sizeSheen();      // 缎面光带跟着画布尺寸重算（见函数注释里的 NaN 陷阱）
  sizeTide();       // 潮汐栏的离屏基准宽度只在 resize 时算一次
  clothBorn = performance.now();
}
addEventListener('resize', resize);

let dark = false;
/* 主题
   base    水面底色
   sheen   水面斜向柔光
   shade   起伏的波谷（比底色暗一档）
   ringHi  涟漪高光（外沿 + 环顶）
   ringLo  涟漪凹陷（环内侧，体积感的关键）
   breath  呼吸光

   浅色 = 水：黑 / 白 / 灰，无任何彩色或绿调
   深色 = 丝绸：暖棕系，哑光。交互也换成丝绸 —— 拖动产生褶皱，轻缓抚平

   matte = 哑光度（0 = 镜面水，1 = 全哑光）
     哑光的物理含义是「没有镜面反射」：
       · 不该有锐利的高光点，只有柔和的宽过渡
       · 方向性光影极弱（漫反射不挑方向）
       · 体积感改由「凹陷」承担，而不是由高光承担
     所以哑光不是简单调暗，而是要把光从「亮点」摊成「面」。 */
const THEME = {
  light: {
    base:    [250, 251, 249],
    sheen:   [255, 255, 255],
    sheenA:  0.26,
    shade:   [228, 230, 227],
    shadeA:  0.34,
    ringHi:  [255, 255, 255],
    ringLo:  [208, 210, 208],
    breath:  [255, 255, 255],
    breathA: 0.10,
    viscous: 0,       // 黏度：0 = 水，1 = 咖啡
    matte:   0        // 哑光度
  },
  dark: {
    /* 丝绸（哑光）：底色带红棕的暖深褐，不是纯黑。
       亮色一律往底色方向压 —— 哑光表面上没有比底色亮很多的东西，
       只有「略微隆起处多一点漫反射」。 */
    base:    [40, 27, 20],
    sheen:   [96, 69, 50],       // 斜向反光：很淡的焦糖色
    sheenA:  0.16,
    shade:   [28, 18, 12],       // 褶皱的谷：更深的褐
    shadeA:  0.38,
    ringHi:  [116, 86, 63],      // 褶皱的脊：只比底色亮一档
    ringLo:  [22, 14, 10],       // 背光侧：比底色更深
    breath:  [80, 57, 40],
    breathA: 0.055,
    /* 哑光 ≠ 看不见。dim 要保证褶皱仍可读，
       「哑光」体现在没有镜面亮线（PEAK 被压低、方向光影被压到 0），
       而不是单纯把整体调暗。调太暗会变成"看不见"，那是另一种失败。 */
    dim:  0.95,
    viscous: 1,
    matte:   1
  }
};

const ripples = [];
let lastX = null, lastY = null;
let dirX = 1, dirY = 0;   // 上一次指针移动方向（布面推起的方向）
let foldLastT = 0;        // 上次操作的时刻（算速度）

const GAP   = 28;     // 鼠标每移动这么多 px 生成一个涟漪
const LIFE  = 2800;   // 每个涟漪活多久 ms（全程 2.8s）
const SLOW  = 0.00030;// 起伏周期 ≈ 21s（15—25s 区间）

/* ============================================================
   丝绸（深色模式专用）：抓住布的一角拖动
   ------------------------------------------------------------
   关键认知：**不是「一道一道画褶子」，而是「布面被推起来」。**
   褶皱是布面形变的结果，不是一个个独立元素 ——
   相邻的褶皱必须连成一片连续的起伏，否则就是「条形码」。

   实现：低分辨率高度场 + 柔性扩散 + 浮雕光照
     1. 抬起     liftCloth 沿推移方向堆出横褶（垂直于推移方向的凸脊），
                 高度采用「首次定型 + 2% 累积」→ 褶皱形成后静止
     2. 柔性     relaxCloth 每帧向邻格轻微扩散，把尖褶揉成连续布面
     3. 浮雕     按高度梯度求法线，用光源方向着色 → 天然有体积

   为什么不用「一堆矩形」：矩形之间永远拼不成连续曲面。
   高度场是一整张布，褶皱是这张布上的起伏，天然连续。
   ============================================================ */
const FCELL     = 6;      // 高度场格距 px
const FR_ALONG  = 4.2;    // 褶脊半厚（沿推移方向，px）= 0.70 格，与原 5/7 同比例
const F_STEP    = 28;     // 沿路径每隔多少 px 堆一道褶脊
                                // 必须 > 高斯有效宽度（≈ FR_ALONG × 2.5 ≈ 10px），
                                // 否则相邻褶脊叠满 → 布面变成一条光滑凸起，读不出褶
const FR_CROSS  = 255;    // 褶脊半长（垂直于推移方向，px）
                                // 要**足够长**：短褶脊是一段段孤立的弧形凸起，
                                // 要靠后续扩散才连得起来 → 「先僵硬弧形、后柔化成褶」的两阶段感
const F_LIFT    = 0.95;   // 抬起的高度
const F_SOFT    = 1.30;   // 高斯衰减系数
const F_RELAX   = 0.022;  // 每帧向邻格扩散 = 布的柔性
                                // 只在停止移动前运行，且做总量补偿（见 relaxCloth）
const F_FREEZE  = 900;    // 停止移动多久后褶皱定型（之后完全静止）
const F_DAMP    = 2.15;   // 阻尼刚度（褶皱鼓起的快慢）
const F_ZETA    = 0.42;   // 阻尼比（<1 有余震）
const F_CLIFF   = 13.0;   // 浮雕光照的陡峭度（决定凹凸对比）

/* ---- 欠阻尼弹簧的解析解 ----
   不是逐帧积分 —— 逐帧积分依赖帧率，60fps 与 144fps 手感不同。
   解析解只依赖绝对时间差，跨设备一致。 */
function damped(t, k, z){
  if(z >= 1) return 1 - (1 + k * t) * Math.exp(-k * t);
  const wd = k * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * k * t) * (Math.cos(wd * t) + (z * k / wd) * Math.sin(wd * t));
}

/* ---- 缎面本底光泽（平布也有光泽的关键）----
   缎面的物理特征是**各向异性**：垂直于织纹的方向有一条宽而柔的光带。
   没有这层，平布就是一块死色 —— 交互单元做得再好也救不回来。

   🔴 这里必须用 let + 在 resize() 里赋值，**不能用 const 在声明处算**：
   W 此时还是 undefined，`-W * 0.12` 会得到 NaN，
   而 NaN 传播到 alpha 后 `(NaN*255)|0 === 0` —— 整个布面被清空成透明。
   这个坑极隐蔽：高度场、梯度、光照全都算对了，只有 alpha 全是 0。 */
let S_BAND_C  = 0, S_BAND_W  = 1;      // 主光带
let S_BAND2_C = 0, S_BAND2_W = 1;      // 第二条更宽更淡的光带
const S_BAND_A  = 0.072;               // 主光带强度（要克制：这是「有光泽」，不是「变亮」）
const S_BAND2_A = 0.040;               // 第二条强度

function sizeSheen(){
  S_BAND_C   = -W * 0.12;
  S_BAND_W   =  W * 0.34;
  S_BAND2_C  =  W * 0.30;
  S_BAND2_W  =  W * 0.52;
}

/* ============================================================
   单场高度场
   ------------------------------------------------------------
   field[i] = 该处布料被推起的高度。
   「首次定型 + 2% 累积」而不是无脑累加：
     无脑累加会让反复扫过的区域顶到上限 → 梯度为 0 → 褶皱被抹平。
   累积量小，所以褶皱形成之后就停在那里（静止）。
   ============================================================ */

let field = null, GW = 0, GH = 0, fcv = null, fctx = null, fimg = null;
let clothBorn = 0;   // 布面开始鼓起的时刻（阻尼包络的起点）
let lastMoveT = 0;   // 最后一次指针移动的时刻（褶皱定型闸门）

function buildField(){
  GW = Math.max(2, Math.ceil(W / FCELL));
  GH = Math.max(2, Math.ceil(H / FCELL));
  field = new Float32Array(GW * GH);
  fcv = document.createElement('canvas');
  fcv.width = GW; fcv.height = GH;
  fctx = fcv.getContext('2d');
  fimg = fctx.createImageData(GW, GH);
}

function clearField(){
  if(field) field.fill(0);
}

/* 涟漪形状
   一个涟漪 = 一组同心波，每个波有自己的滞后时间与衰减。
   这是「像水」的关键：单环永远是甜甜圈，多波才是水。 */
const WAVES      = 5;      // 同心波个数：密而细才像水
const R_INNER    = 0.32;   // 内圈波占终半径的比例（越小，波列间距越宽）
const R_BASE     = 250;    // 终半径基准
const R_VAR      = 0.50;   // 终半径随机浮动 ±50%（所以每个涟漪大小都不同）
const WAVE_W_MIN = 4;      // 环宽下限（px）
const WAVE_W_MAX = 13;     // 环宽上限（px）—— 环要细，模糊就假了
const RING_SOFT  = 0.82;   // 环内侧凹陷相对环顶的强度（体积感全靠它）
const LIGHT_DIR  = -2.15;  // 光源方向（弧度，指向左上）
const DENT_FADE  = 0.30;   // 撞击点凹陷的消散速度：水面会重新变平

/* 涟漪终半径的随机浮动还要跟屏幕大小挂钩。
   涟漪尺寸是绝对像素（px），手机屏短边只有 390px，
   桌面上合适的 250px 在手机上会占掉大半屏、把画面糊掉。
   所以按「屏幕短边 / 桌面基准短边」缩放，并设下限防止缩得过小。 */
function scaleForScreen(){
  const ref = 860;                                   // 基准短边（桌面 1280×800 → 800）
  const cur = Math.min(W || ref, H || ref);
  return Math.max(0.40, Math.min(1, cur / ref));    // 手机 390 → 0.45
}

function spawn(x, y, boost){
  // 每个涟漪终半径不同：小的像雨滴，大的像手掌拍下去
  const k = scaleForScreen();
  const scale = (1 - R_VAR) + Math.random() * R_VAR * 2;
  ripples.push({
    x: x,
    y: y,
    born: performance.now(),
    maxR: R_BASE * k * scale,
    boost: boost || 1,     // 保底验证涟漪可单独提亮
    phase: Math.random() * Math.PI * 2,
    squish: 0.90 + Math.random() * 0.18   // 轻微椭圆，避免全是正圆
  });
}

/* 抬起布面：沿推移方向堆出一道长而薄的横褶脊

   一道褶脊 = 一个在垂直于推移方向上**很长**、沿推移方向上**很薄**的高斯脊。
   沿路径每 F_STEP 像素堆一道，相邻的脊自然排成一列褶。

   两个尺寸必须同时满足（褶皱可见 / 不可见的分界）：
     · FR_ALONG ≥ 1.5 格  —— 否则脊比格子还窄，写进高度场时被采样丢掉
     · F_STEP  > FR_ALONG × 2.5 —— 否则相邻脊叠满，变成一条光滑凸起
   FR_CROSS 要够大，脊才横贯布面、看起来连续而不是一段段孤立的弧。 */
function liftCloth(x, y, dx, dy, speed){
  if(!field) return;
  lastMoveT = performance.now();
  const gx = x / FCELL, gy = y / FCELL;
  const A  = FR_ALONG / FCELL, C = FR_CROSS / FCELL;
  const i0 = Math.max(0, Math.floor(gx - A * 1.8));
  const i1 = Math.min(GW - 1, Math.ceil(gx + A * 1.8));
  const j0 = Math.max(0, Math.floor(gy - C));
  const j1 = Math.min(GH - 1, Math.ceil(gy + C));

  const amt = F_LIFT * Math.max(0.22, Math.min(1.6, 0.34 + speed * 0.66));
  /* 布的褶天然是不均匀的：每道褶的高度、长度、锐度都该有差别。
     没有这层随机，褶皱会像百叶窗一样规整，一眼就看出是程序生成的。 */
  const varyH = 0.50 + Math.random() * 0.85;   // 高度
  const varyW = 0.62 + Math.random() * 0.70;   // 长度
  const varyS = 0.75 + Math.random() * 0.60;   // 锐度

  for(let j = j0; j <= j1; j++){
    const ry = j - gy;
    for(let i = i0; i <= i1; i++){
      const rx = i - gx;
      const al =  rx * dx + ry * dy;    // along：沿推移（薄）
      const cr = -rx * dy + ry * dx;    // cross：垂直推移（长）
      const u = al / A, v = cr / (C * varyW);
      const q = u * u + v * v * 0.55;   // 垂直方向衰减更慢 → 脊更长更连续
      if(q > 3.0) continue;

      const h = amt * varyH * Math.exp(-q * F_SOFT * varyS);
      const idx = j * GW + i;
      /* 「首次定型 + 轻微累积」，而不是无脑累加。
         无脑累加会让反复扫过的区域顶到上限 → 梯度为 0 → 褶皱被抹平。 */
      const cur = field[idx];
      field[idx] = cur < h ? h : cur + h * 0.02;
    }
  }
}

/* 布的柔性：成形期间每帧向邻格轻微扩散，把尖褶揉成连续曲面。

   🔴 三个必须记住的点：
   1. 扩散会**衰减总高度**，几百帧后高度场就塌了 → 必须做总量补偿
      （但即便补偿，形状已被抹平，梯度补不回来 —— 所以系数必须小）
   2. 扩散会**抹平梯度**，而褶皱的可见性恰恰来自梯度 → 系数大了褶皱消失
   3. 要「静止」就必须有时间闸门：停止移动后完全不再扩散 */
function relaxCloth(now){
  if(!field) return;
  if(now - lastMoveT > F_FREEZE) return;

  let s0 = 0;
  for(let i = 0, n = field.length; i < n; i++) s0 += field[i];
  if(s0 < 1e-5) return;

  const k = F_RELAX;
  for(let j = 1; j < GH - 1; j++){
    const row = j * GW;
    for(let i = 1; i < GW - 1; i++){
      const idx = row + i;
      const avg = (field[idx - 1] + field[idx + 1] + field[idx - GW] + field[idx + GW]) * 0.25;
      field[idx] += (avg - field[idx]) * k;
    }
  }

  // 总量补偿：上限要放宽（衰减是指数的，卡在 3 倍以内会导致补偿失效）
  let s1 = 0;
  for(let i = 0, n = field.length; i < n; i++) s1 += field[i];
  if(s1 > 1e-6){
    const g = s0 / s1;
    if(g > 1 && g < 12){
      for(let i = 0, n = field.length; i < n; i++) field[i] *= g;
    }
  }
}

/* 渲染布面：高度场 → 法线 → 浮雕光照
   这才是体积感的来源。褶皱不是画上去的，是「光打在起伏上」照出来的。 */
function drawCloth(now, T){
  if(!field || !fimg) return;

  const hi = T.ringHi, lo = T.ringLo;
  const M = T.matte || 0;
  const dim = (T.dim || 1);
  const lx = Math.cos(LIGHT_DIR), ly = Math.sin(LIGHT_DIR);

  /* 阻尼包络：整个布面「缓缓鼓到位」后静止。
   成形用欠阻尼曲线，有一次轻微过冲。 */
  const g = Math.min(1.15, damped((now - clothBorn) / 1000 * 1.6, F_DAMP, F_ZETA));
  const amp = dim * g;

  const d = fimg.data;
  const HRGB = [hi[0], hi[1], hi[2]];
  const LRGB = [lo[0], lo[1], lo[2]];

  for(let j = 0; j < GH; j++){
    const jm = j > 0 ? j - 1 : j, jp = j < GH - 1 ? j + 1 : j;
    for(let i = 0; i < GW; i++){
      const o = (j * GW + i) * 4;
      const h = field[j * GW + i];

      /* ① 缎面本底光泽 —— 即使布是平的（h = 0）也必须有
            缎面的核心特征是**各向异性**：垂直于织纹的方向有一条宽而柔的光带。
            没有这一层，平布就是一块死色，交互单元再对也救不回来。 */
      const bx = i * FCELL, by = j * FCELL;
      const diag = (bx + by) * 0.72 - (bx - by) * 0.28;
      const band = Math.exp(-(diag - S_BAND_C) * (diag - S_BAND_C) / (2 * S_BAND_W * S_BAND_W));
      // 第二条更宽更淡的光带：缎面的反光不是只有一条
      const band2 = Math.exp(-(diag - S_BAND2_C) * (diag - S_BAND2_C) / (2 * S_BAND2_W * S_BAND2_W));
      // 布本身的极微弱起伏，让平布也有细腻的微光而不是纯色
      const micro = 0.055 * (Math.sin(bx * 0.0121 + 0.7) * Math.sin(by * 0.0097)
                          + 0.55 * Math.sin((bx + by) * 0.0083 + 2.1));
      const baseA = (S_BAND_A * band + S_BAND2_A * band2) * dim;

      if(h < 0.006 && baseA < 0.004){ d[o + 3] = 0; continue; }

      /* ② 褶皱光照：中心差分求梯度 → 法线 */
      const im = i > 0 ? i - 1 : i, ip = i < GW - 1 ? i + 1 : i;
      const gx = field[j * GW + ip] - field[j * GW + im];
      const gy = field[jp * GW + i] - field[jm * GW + i];

      const K = F_CLIFF;                 // 起伏陡峭度（决定凹凸的对比）
      let nx = -gx * K, ny = -gy * K, nz = 1;
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= nl; ny /= nl; nz /= nl;

      // 半兰伯特光照：丝绸是哑光，光要软
      let diff = (nx * lx + ny * ly + nz * 0.55) * 0.5 + 0.5;
      diff = Math.pow(diff, 1.15 + 0.5 * M);

      /* 明暗主要来自「坡度」（法线光照），不是「高度」。
         如果让绝对高度主导亮度，隆起区会整片饱和成一条亮带，
         褶脊之间的起伏反而被抹平 —— 这是浮雕渲染最容易搞错的一点。 */
      const hh = Math.min(1, h * 0.55);
      const c = diff * (0.74 + 0.26 * hh);
      // 低处略偏暗色（往 lo 走），高处的偏移要小，否则又是「按高度上色」
      const mix = 0.30 * (1 - diff);
      const r0 = HRGB[0] * (1 - mix) + LRGB[0] * mix;
      const g0 = HRGB[1] * (1 - mix) + LRGB[1] * mix;
      const b0 = HRGB[2] * (1 - mix) + LRGB[2] * mix;

      /* 褶皱高光 + 缎面本底 + 微观起伏，三者相加。
         这里刻意**不做「平布闸门」**：
         纯平布处 diff 有一个 0.775 的基线，直接相加会让平布偏亮；
         但一旦加 `h < 阈值 → 0` 的闸门，正在成形、梯度尚浅的褶会被判成
         平布而完全消失（试过 0.004 / 0.006 / isFlat 三种判据，全都不行）。
         所以改用「减去基线」的方式：把平布的光照贡献整体扣掉，
         既不会让平布发亮，也不会误伤浅褶。 */
      const flatDiff = Math.pow(0.775, 1.15 + 0.5 * M);   // 平布（法线恒为 (0,0,1)）的 diff
      const relief = Math.max(0, diff - flatDiff) / (1 - flatDiff);
      const foldA = c * amp * (0.22 + 0.78 * relief);
      const A = Math.min(1, foldA + baseA + micro * dim * 0.5);
      d[o]     = r0;
      d[o + 1] = g0;
      d[o + 2] = b0;
      d[o + 3] = (A * 255) | 0;
    }
  }

  fctx.putImageData(fimg, 0, 0);
  // 放大贴回。柔化细节无妨，反而更像布。
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(fcv, 0, 0, W, H);
  ctx.restore();
}

/* ============================================================
   水面底：铺底 + 斜向柔光 + 极慢起伏
   画在低分辨率离屏画布上再放大贴回：
   柔光与亮带本就是模糊的，放大后依然平滑，
   但每帧的填充成本降到约 1/6，涟漪仍按全分辨率绘制。
   ============================================================ */
const SURF_SCALE = 0.42;
let sur = document.createElement('canvas');
let sctx = sur.getContext('2d');

function rgba(c, a){
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}

function buildSurface(){
  sur.width  = Math.max(2, Math.round(W * SURF_SCALE));
  sur.height = Math.max(2, Math.round(H * SURF_SCALE));
}

/* ============================================================
   潮汐导航栏（只做浅色模式）
   ------------------------------------------------------------
   形态：3~4 层半透明冷白水膜叠在一起，每层的右边缘各自起伏。
   质感全靠「透明度的叠加」而不是实色块——
   4 层各 α≈0.3 叠起来最多也就是 1-(1-0.3)^4 ≈ 0.76 的白，
   底下始终透得出水面，这就是「轻透」的来源。

   为什么把 canvas 固定成 25vw 而不是每帧改成当前栏宽：
   每帧改 canvas.width 会重新分配画布内存并清空内容，
   60fps 下等于每秒重置 60 次。宽度律动交给外层 #hot 的
   overflow 裁切，canvas 只在 resize 时 sizing 一次。
   ============================================================ */
const hotEl= document.getElementById('hot');
const tideCv= document.getElementById('tide');
const tctx   = tideCv.getContext('2d');

let TW = 0, TH = 0;        // 潮汐画布的 CSS 尺寸
let hotW = 0;              // 当前栏宽（px，每帧更新，写进 #hot 的 width）
let tidePhase = 0;         // 潮汐相位：只在「未进入热区」时累加 → 天然实现相位锁定
let tideOn  = false;       // 是否处于热区（冻结 + 收拢 + 显示按钮）

/* ---- 调研结论：真实潮汐长什么样（决定了下面的参数结构）----

   ① **浪不是均匀的，是成组来的（set / 波群），组间有 lull。**
      两个周期略不同的涌浪（真实如 10s 与 11s）相乘，
      波峰对齐处叠加成大浪、错开处抵消变平。
      → 所以「呼吸感」不能靠一个正弦慢慢缩放，
        必须有一层**独立于波峰的慢包络**在推着振幅起落。

   ② **群速度 ≈ 相速度的一半**（深水）。
      一组浪的能量包络往前走得只有单个波峰的一半快。
      → 包络必须**单独用半速推进**。
        若让包络跟着波峰同速跑，视觉上会退化成「整块在明暗呼吸」，
        读起来是呼吸灯，不是潮。

   ③ **ground swell（远方风暴长周期涌浪）频带窄** → set 清晰、lull 长而明显；
      本地风浪频带宽 → set 糊在一起。真实海岸观感以长周期为主。
      → 包络取「长周期为主 + 短周期扰动」，
        且扰动只做小幅（0.5 / 0.32 权重），避免变成锯齿。

   ④ **组内结构**：前小 → 中间最大 → 后小（波峰从组后进入、增长、穿过、消失）。
      → 包络不做对称正弦，用 pow(·, 1.35) 把谷压得更平、峰更尖，
        接近「涌过来一段然后真的停一会儿」。

   ⑤ **波长沿程变短、浪高变大**（shoaling，近岸处水变浅）。
      → 外层（最靠岸 = 最右）振幅最大、波长最短；越往左越平缓。

   ⑥ **波峰线长而整齐，但不是正弦**，沿途有缓慢的长周期起伏。
      → 每层 3 个互质频率叠加（1.1 / 2.3 / 3.7…），
        主频定基本波长，副频给不规则，避免机械感。

   ⚠️相位推进速度不能给太小。竖向波长由 fs 固定，横向推移速度 ≈ sp / fs：
   sp=0.16 时主频横向走完一个波形要≈43 秒，肉眼判定为「静止」。
   现在 sp≈0.55 → 约 12 秒一个波形，仍是缓慢的潮，但明确读得出在动。 */

/* 3 层水膜。层数从 4 降到 3：4 层时轮廓线互相穿插，读起来是「一堆线」，
   3 层刚好能看出「前-中-后」的前后关系，又不糊。

   🔴 base 递增 = 由远及近（左侧远、右侧近），绘制顺序也是由远及近 ——
      这就是画家算法：近的后画，自然压在远的上面。
      反过来（先画近的）会让远处的线糊在近处的膜上，深度关系全反。

   shoaling（近岸水浅 → 波长变短、浪高变大）：
      越靠右（越近）amp 越大、fs 越小（波长越短）。

   🔴 base·hotW + amp·innerWidth 必须 ≤ hotW，否则浪尖被 overflow:hidden
      硬切出一条竖直直线（不是浪）。最紧的约束出现在**热区收拢态**
      （hotW = 288px = 0.2×1440），所以 base 要按 0.2 屏宽那一档校验。
      当前最外层 0.74×288 + 0.048×1440 = 282 ≤ 288 ✓

   fs/sp 四组分量的分工：
     ① fs 最小 + sp 最小 → 长波、极慢，给整条线一个大尺度的缓慢涌起
     ② 中长波 → 主体起伏
     ③ 中波 → 细节
     ④ 短波 + 最快 → 细纹，制造「在动」的密度感
   🔴 sp 原来给到 0.52（≈68px/s），8 秒只走半个波长，盯着看像轻微颤动。
      主频提到 1.05（≈137px/s）后「在动」才成立。 */
const TIDE_LAYERS = [
  /* 最远（最左）：振幅小、波长长、线最多最密（远处东西挤在一起） */
  { amp:0.030, base:0.40, gap:0.17, lines:4,
    fs:[0.45, 0.90, 2.1, 4.3], sp:[0.26, 0.44, 1.00, 2.00],
    a:[0.34, 0.30, 0.24, 0.12], al:0.30, lag:0.86 },
  /* 中间 */
  { amp:0.038, base:0.57, gap:0.16, lines:3,
    fs:[0.55, 1.10, 2.5], sp:[0.32, 0.54, 1.22],
    a:[0.33, 0.30, 0.26], al:0.32, lag:0.42 },
  /* 最近（最右）：振幅最大、波长最短 —— 近岸 shoaling */
  { amp:0.048, base:0.74, gap:0.15, lines:3,
    fs:[0.70, 1.35, 3.0], sp:[0.40, 0.68, 1.52],
    a:[0.32, 0.30, 0.26], al:0.34, lag:0.00 }
];

/* ============================================================
   set-lull 包络 —— 「变化感 / 呼吸感」的真正来源
   ------------------------------------------------------------
   🔴 上一版被钟老师批「完全是静态的上下播放」，真因有三，
      全部出在包络的**时间形状**和**空间分布**上：

   ① **对称 = 上下播放。**
      `pow(max(0, 0.5+0.5·sin(·)), 1.35)` 展开后仍是一个左右对称的鼓包，
      于是包络涨→落→涨，视觉上就是「一个固定的形状在原地放大缩小」。
      真实的 set 是**非对称**的：一组浪突然涌过来（快），
      然后退回去（慢，拖尾），中间是真的停一会儿。
      形状必须偏斜，不能对称。

   ② **整体缩放 = 静止。**
      同一个 env 乘到整条边缘上 → 整条边一起呼吸。
      真实涌浪有**涌浪方向**（swell direction），set 是**斜着推过来**的：
      这条边的底部正在涌，那条边的顶部还在平。
      → env 必须带 y 变量，且随时间沿 y 推进。

   ③ **只有一条边 = 读不出「波浪」。**
      真实涌浪的招牌视觉是**等距、平行的一组波峰线**
      （surfertoday：swell "appear on the horizon in evenly spaced out,
      parallel lines of waves"）。
      → 每层除边缘外，再补 1 条内部平行波峰线。

   周期来源：两个周期略不同的涌浪（真实如 10s / 11s）相乘，
   波峰对齐处叠成大浪、错开处抵消 —— 所以主 set 周期取 ~9s，
   再叠两个不可通约的短周期扰动，避免整体循环被肉眼抓到。
   ============================================================ */

/* 非对称脉冲：0→1→0，但上升只占 30% 周期，退去占 70%。
   pow 指数 <1 让涌入更「顶」，>1 让退去更「拖」。 */
function tidePulse(p){
  if(p < 0.30) return Math.pow(p / 0.30, 0.62);          // 涌入：快而顶
  return Math.pow(1 - (p - 0.30) / 0.70, 2.4);           // 退去：慢而拖尾
}

/* 🔴 以 tidePhase 为唯一时间源，不能用 now。
   相位锁定时 tidePhase 停 → 包络停 → 边缘、alpha、宽度全部停。
   若这里用 now，热区里看着在「冻结」的包络其实一直在走。

   y 决定相位偏移 —— 这是「涌浪方向」的全部来源：
   底部已经涌到、顶部还没到，整条边缘沿 y 斜着推进。 */
function tideSet(y, lag){
  const t = tidePhase;
  const u = y / TH;
  const TAU = Math.PI * 2;

  /* TILT 0.42：沿 y 每经过 0.42 个周期就错开一整个 set。
     这是破解「整条边一起缩放」的唯一办法 —— 必须有空间梯度。
     lag 让三层各自错开一点 → set 从一层涌向下一层，不是三层齐涨齐落。 */
  let p = (t * 0.698 - u * 0.42 + lag) / TAU;  p -= Math.floor(p);
  let q = (t * 1.337 - u * 0.61 + lag * 1.6) / TAU;  q -= Math.floor(q);
  let r = (t * 0.814 - u * 0.33 + lag * 2.2) / TAU;  r -= Math.floor(r);

  /* 主 set 权重 1.0，两个扰动只做微调（0.22 / 0.14）。 */
  const e = tidePulse(p)
          + tidePulse(q) * 0.22
          + tidePulse(r) * 0.14;

  /* 下限 0.22：lull 时不完全消失。
     归零会让整层闪一下，是最刺眼的失败；真实 lull 只是「变薄」不是「消失」。 */
  return 0.22 + 0.78 * Math.min(1, e);
}

/* 冷白 rgba(244,248,252,α)：略偏蓝的水膜色 */
const TIDE_RGB = '244,248,252';

/* 边缘线的颜色：冷灰蓝。
   🔴 纯白压在近白底 #FAFBF9(250,251,249) 上只差 5/255 —— 等于没画。
   真正让人看见波峰形状的是这层灰蓝（差 60+/255）。 */
const TIDE_RIM = '190,204,220';

function sizeTide(){
  TW = Math.max(2, Math.round(innerWidth * 0.25));
  TH = Math.max(2, innerHeight);
  const d = Math.min(window.devicePixelRatio || 1, 2);
  tideCv.width  = Math.round(TW * d);
  tideCv.height = Math.round(TH * d);
  tideCv.style.width  = TW + 'px';
  tideCv.style.height = TH + 'px';
  tctx.setTransform(d, 0, 0, d, 0, 0);
  /* resize 后直接把栏宽对齐到目标值。
     若保留旧值，收拢状态下 resize 会让栏宽从一个很窄的值慢慢长回来，
     看起来像「被拉扯」而不是「换了个窗口」。 */
  hotW = tideOn ? innerWidth / 5 : tideBreath(performance.now());
}

/* 某一层在高度 y 处的右边缘 x（px）
   base 与 amp 单位不同：base 是栏宽比例，amp 是**视口宽**比例。
   🔴 包络在这里按 y 实时求值 —— 「涌浪方向」全靠这个 y 变量。
   若在循环外算一个标量传给整条边，整条边会一起缩放 = 原地呼吸。 */
/* 某一层在高度 y 处的右边缘 x（px）—— 即 j=0（最前那道波峰）。
   base 与 amp 单位不同：base 是栏宽比例，amp 是**视口宽**比例。
   🔴 包络在这里按 y 实时求值 —— 「涌浪方向」全靠这个 y 变量。
   若在循环外算一个标量传给整条边，整条边会一起缩放 = 原地呼吸。 */
function tideEdge(L, y, w){
  const u = y / TH;
  let s = 0;
  for(let k = 0; k < L.fs.length; k++){
    s += Math.sin(u * Math.PI * 2 * L.fs[k] + tidePhase * L.sp[k] + k * 1.7) * L.a[k];
  }
  /* 频率之间互质（1.1/2.3/3.7 …）→ 波形不会周期重复，
     长时间看也不会出现「明显在循环」的机械感。
     🔴 起伏整体乘包络：波峰高度随「一组浪涌来」而涨落，
     这才是呼吸感 —— 只让相位走而振幅不动，看到的只是「波形在横向流动」。 */
  return L.base * w + L.amp * innerWidth * s * tideSet(y, L.lag);
}

/* 第 j 道波峰线（j=0 最前，j 越大越靠内陆）。
   🔴 内部线**必须复用同一份波形**，只在 x 上平移 —— 这样线与线永远平行等距
   （真实涌浪正是如此）。
   🔴 间距必须**按几何级数递减**，不能用固定间距：
   固定间距 → 所有线等距 → 读出来是「百叶窗/面条」。
   真实透视下，远处的东西挤在一起、近处散开：越靠内间距越小。 */
function tideCrest(L, y, w, j){
  if(j === 0) return tideEdge(L, y, w);
  /* gap * (1 + 0.62 + 0.62² + …) 累加到第 j 道 —— 越往里越密 */
  let off = 0;
  for(let n = 1; n <= j; n++) off += L.gap * Math.pow(0.62, n - 1);
  return tideEdge(L, y, w) - off * w;
}

/* ============================================================
   体积感：给每道波峰做「截面」，并让光沿波峰线变化
   ------------------------------------------------------------
   🔴 上一版每道棱只有一条**等宽的带**，读出来是**贴纸**——
      贴纸的特征：宽度均匀、颜色均匀、边缘均匀，且**整条一样亮**。
      真实水面这四条一条都不成立。

   三处改动，缺一个都读不出体积：

   ① **截面要有明暗方向。**
      canvas 的 `stroke()` 是**以路径为中心的对称带**，天然没有单侧明暗。
      所以每一道带都要用**偏移路径**画：负偏移落在受光面、正偏移落在背光面。
      光来自左上、波向右涌 →
        -x 侧 = 背面缓坡，受光，越靠近棱越亮
         棱线 = 镜面高光，最亮
        +x 侧 = 迎面陡面，背光，快速衰减成落影
      不做偏移 → 就是一条等宽灰带 = 贴纸。

   ② **阴影要够深，纯白高光才有意义。**
      浅底 #FAFBF9 上纯白 255 只比底色亮 5/255，肉眼等于没画。
      体积感**全靠阴影撑起来**：落影压到 rgba(142,164,190, ~0.17)，
      高光被两侧的暗夹住才读成「反光」。
      只加高光不加阴影 = 什么都不会发生。

   ③ **光要沿波峰线（y）变化。**
      整条线一样亮 → 又回到贴纸。
      三个互质慢正弦叠加，让整条线有明暗起伏（慢到不抢戏）。

   外加：每道棱在自己身后（-x 侧）投一道**软阴影**到更远的层上——
   画家算法下近的后画，这道影自然压在远层的膜面上 → 层与层之间有前后。
   ============================================================ */

/* 沿波峰线方向的光照变化（0.62~1.00）—— 让整条线不是等亮的。
   必须以 tidePhase 为唯一时间源，否则相位锁定时光还在动。

   🔴 三项的频率要**逐级递减且幅度递减**（0.13 / 0.045 / 0.015）：
      高频项幅度一大，纵向渐变的色标折点就变成可见的横纹
      （截图里出现「木纹/阶梯」—— 8 段渐变 + 大振幅 = 一条条横带）。 */
function tideLight(y, li){
  const u = y / TH;
  return 0.76
       + 0.13 * Math.sin(u * Math.PI * 2 * 1.3  + li * 2.1 + tidePhase * 0.11)
       + 0.045* Math.sin(u * Math.PI * 2 * 2.7  + li * 4.7 + tidePhase * 0.19)
       + 0.015* Math.sin(u * Math.PI * 2 * 4.9  + li * 1.3 + tidePhase * 0.31);
}

/* 截面色标：偏移 dx(px) / 线宽 / 色 / 底层 alpha。
   顺序 = 绘制顺序，从最外最暗画到棱线最亮（后画的压在上面）。 */
const TIDE_SECTION_LEAD = [
  /* 落影（+x 侧，背光）—— 体积感的主要来源，必须够深 */
  { dx: 38, w: 46, c:'150,172,196', a:0.055 },
  { dx: 24, w: 28, c:'150,172,196', a:0.085 },
  { dx: 14, w: 16, c:'146,168,194', a:0.120 },
  { dx:  7, w:  8, c:'142,164,190', a:0.165 },
  /* 受光面（-x 侧）—— 缓坡，缓慢亮起 */
  { dx: -6, w: 14, c:'252,254,255', a:0.090 },
  { dx:-15, w: 24, c:'244,250,254', a:0.058 },
  { dx:-30, w: 40, c:'236,244,251', a:0.034 },
  /* 棱线镜面高光 */
  { dx:  0, w:2.0, c:'255,255,255', a:0.460 }
];
/* 内部线：带子更少更窄（远水更平），但仍保留正反两侧 */
const TIDE_SECTION_SUB = [
  { dx: 20, w: 22, c:'152,174,198', a:0.055 },
  { dx: 10, w: 11, c:'148,170,196', a:0.085 },
  { dx: -7, w: 12, c:'250,253,255', a:0.055 },
  { dx:-18, w: 22, c:'240,248,253', a:0.032 },
  { dx:  0, w:1.3, c:'255,255,255', a:0.320 }
];
/* 层间投影：近的棱在远的膜面上投的软影 */
const TIDE_CAST = [
  { dx:-46, w: 56, c:'146,166,190', a:0.048 },
  { dx:-28, w: 32, c:'146,166,190', a:0.062 }
];

/* 包络 → 带宽/影深 的统一缩放：lull 时浪变薄（带变窄、影变淡）。
   三处渲染（膜面暗带、截面、层间投影）共用它，保持一致。 */
function spreadOf(env){ return 0.62 + 0.38 * env; }

/* 把一条波峰线加宽成「带」并作为填充路径。
   🔴 为什么不用 `stroke()` + `lineWidth`：
   1. stroke 是**以路径为中心的对称带**，没有单侧明暗 → 读成贴纸；
   2. stroke 的 alpha 沿路径**无法变化** → 整条线等亮，又回到贴纸。
   ribbon 填充两个都解决：可以整体偏移（造出受光/背光两面），
   配 createLinearGradient(0,0,0,TH) 就能让亮度沿 y 连续变化。

   🔴🔴 加宽必须沿**法线**，不能只做水平偏移：
      水平偏移时，曲线陡峭段上下两条边界会交叉 → ribbon 自相交 →
      nonzero 填充规则把缠绕区域判为「内部」→ 出现横向条纹（像阶梯/木纹）。
      我第一版就是横��偏移，截图里满屏阶梯纹。
      法线 = 曲线 (x=f(y)) 的切线 (f', 1) 的垂线 (1, -f')。 */
function tideRibbon(L, j, dx, halfW){
  const E = TIDE_STEP;                // 差分步长，与采样步长一致
  const side = y => {
    const ya = Math.max(0, y - E * 0.5);
    const yb = Math.min(TH, y + E * 0.5);
    const dy = yb - ya;
    /* f'(y)：中心差分。dy 不能为 0（TH=0 或首尾夹紧）→ 退化时取 0（=垂直线） */
    const fp = dy > 0 ? (tideCrest(L, yb, hotW, j) - tideCrest(L, ya, hotW, j)) / dy : 0;
    /* 法线 (1, -fp) 归一化 */
    const inv = 1 / Math.sqrt(1 + fp * fp);
    return { nx: inv, ny: -fp * inv };
  };

  tctx.beginPath();
  /* 上行：沿带子的左缘 */
  let p = side(0);
  tctx.moveTo(tideCrest(L, 0, hotW, j) + dx + p.nx * halfW, p.ny * halfW);
  for(let y = TIDE_STEP; y <= TH; y += TIDE_STEP){
    p = side(y);
    tctx.lineTo(tideCrest(L, y, hotW, j) + dx + p.nx * halfW, y + p.ny * halfW);
  }
  /* 下行：沿带子的右缘回来，闭合成实心带 */
  for(let y = TH - TIDE_STEP; y >= 0; y -= TIDE_STEP){
    p = side(y);
    tctx.lineTo(tideCrest(L, y, hotW, j) + dx - p.nx * halfW, y - p.ny * halfW);
  }
  tctx.closePath();
}

/* 纵向亮度渐变：把 tideLight(y) 采样成色标。
   🔴 采样点**必须够密**（32 段 ≈ 28px 一段）。
      8 段时色标之间的线性插值会在折点留下可见的亮度突变，
      叠加多层后整片膜变成「木纹/阶梯横条」—— 我为此调了好几轮参数，
      真因是采样密度不够，跟 tideLight 的振幅无关。
   🔴 采样是每帧做的（20+ 个 gradient 对象），密度翻倍后仍 < 1ms。 */
function tideBandGrad(c, a, li, k){
  const g = tctx.createLinearGradient(0, 0, 0, TH);
  const N = 32;
  for(let n = 0; n <= N; n++){
    const y = TH * n / N;
    g.addColorStop(n / N, 'rgba(' + c + ',' + (a * k * tideLight(y, li)).toFixed(4) + ')');
  }
  return g;
}

/* 栏宽律动：1/6 ~ 1/4 屏之间，周期 ≈ 39s（2π / 0.161 rad/s）。
   🔴 用 tidePhase 而非 now —— 相位锁定时栏宽也一并停住，
   否则「冻结」会冻结在某个宽度上、而不是它本来该停的那个宽度。
   （tidePhase 停 → sin 恒定 → target 恒定 → 指数逼近会吸附到 target） */
function tideBreath(){
  return (1/6 + (1/4 - 1/6) * (0.5 + 0.5 * Math.sin(tidePhase * 0.161))) * innerWidth;
}

/* 右边缘采样步长：5px 一段，够密才看不出折线。
   必须是函数级作用域 —— 膜面循环和亮线循环都要用它，
   写在循环块内会变成块级 const，后一个循环直接 ReferenceError。 */
const TIDE_STEP = 5;

function drawTide(now, dt){
  /* 深色模式整块隐藏（CSS 已做 opacity:0，这里连渲染一起停掉） */
  if(dark){ hotEl.style.width = '25vw'; return; }

  /* 相位锁定：进入热区后 tidePhase 停止累加，浪就定在那一刻的形状上。
     用累加器而不是直接用 now，是为了让「解锁」时能从冻结处继续，不会跳相位。 */
  if(!tideOn) tidePhase += dt * 0.001;      // dt(ms) → 相位单位（配合 sp 使用）

  const target = tideOn ? innerWidth / 5 : tideBreath();
  /* 收拢/展开都走这一行平滑，避免栏宽在热区边界上硬跳。
     用帧率无关的指数逼近：k = 1 - exp(-dt/τ) */
  const k = 1 - Math.exp(-dt / 190);
  hotW += (target - hotW) * k;
  /* 🔴 必须吸附。指数逼近是渐近的，永不真正到达目标：
     τ=190ms 下过 1.5s 还剩 0.04% 残余。对 313px 栏宽就是 0.12px 的持续漂移 ——
     膜面渐变终点跟着栏宽走，于是「相位已锁定」但 alpha 仍每帧变 1~2/255，
     测相位锁定时永远测不干净。差值小于 0.5px 就直接吸附。 */
  if(Math.abs(target - hotW) < 0.5) hotW = target;
  hotEl.style.width = hotW.toFixed(2) + 'px';

  tctx.clearRect(0, 0, TW, TH);

  /* ============================================================
     膜面：每层填到**最前那道波峰**为止
     ------------------------------------------------------------
     🔴 渐变必须按**这一层自己的边缘位置**归一化，不能按满宽 TW，也不能按栏宽。
        这是第一版没做出来的真因：
          · 按 TW 铺   → 各层右边缘在 0.36~0.80 栏宽处，那里 alpha 已衰减到 24%，
                      轮廓等于画在自己已经透明的地方，只剩几条若有若无的竖带；
          · 按 hotW 铺 → 栏宽每收拢一帧，整个 alpha 剖面重排一次，
                      「相位锁定」只锁住形状，亮度仍缓慢漂移（实测冻结 1.5s 仍有 2/255）。
        改成「0 → 本层边缘」归一化后，每道浪的轮廓都落在自己 alpha 最高处，
        起伏立刻读得出来，同时收拢/律动都不会污染亮度。

     膜面 alpha 吃包络（中线处的值，线性渐变只能取标量）：
     lull 时整片膜变淡，set 到时变厚 —— 「厚度」才真的在呼吸。 */
  for(let i = 0; i < TIDE_LAYERS.length; i++){
    const L = TIDE_LAYERS[i];
    const envMid = tideSet(TH * 0.5, L.lag);

    tctx.beginPath();
    tctx.moveTo(0, 0);
    for(let y = 0; y <= TH; y += TIDE_STEP) tctx.lineTo(tideCrest(L, y, hotW, 0), y);
    tctx.lineTo(tideCrest(L, TH, hotW, 0), TH);
    tctx.lineTo(0, TH);
    tctx.closePath();

    const ex = L.base * hotW + L.amp * innerWidth;
    const a0 = L.al * (0.62 + 0.38 * envMid);
    /* 🔴 渐变铺满「0 → 本层边缘」，右侧**不归零**。
       归零会在每层最前那道波峰线之外留一段「无膜区」，
       三层叠起来就是一条贯通的竖白带 —— 截图里那条白缝就是它。
       真实水膜是一整片连续的，边缘的收口交给波峰线的过渡带去做。 */
    const g = tctx.createLinearGradient(0, 0, ex, 0);
    g.addColorStop(0.00, 'rgba(' + TIDE_RGB + ',' + a0.toFixed(4) + ')');
    g.addColorStop(0.58, 'rgba(' + TIDE_RGB + ',' + (a0 * 0.88).toFixed(4) + ')');
    g.addColorStop(0.86, 'rgba(' + TIDE_RGB + ',' + (a0 * 0.60).toFixed(4) + ')');
    g.addColorStop(1.00, 'rgba(' + TIDE_RGB + ',' + (a0 * 0.34).toFixed(4) + ')');
    tctx.fillStyle = g;
    tctx.fill();

    /* ── 膜面自身的体积 ──
       上一版膜面是**一个横向渐变**填满整片 → 读出来是「一块半透明色板」，
       没有厚度。这一层加两笔：
         · 纵向明暗（沿 y）→ 整片膜不是等亮的
         · 每道内部棱在膜面上留下的**横向暗带**
           （棱挡住了光 → 棱的背光侧在膜面上压一道软影）
       这两笔才让膜面从「色板」变成「有起伏的水」。 */
    tctx.save();
    tctx.clip();          // 裁在膜面内，影不会溢出到层外
    /* ① 纵向明暗：8 段渐变，采样 tideLight */
    const vg = tctx.createLinearGradient(0, 0, 0, TH);
    for(let n = 0; n <= 32; n++){
      const y = TH * n / 32;
      vg.addColorStop(n / 32, 'rgba(150,172,196,' + (a0 * 0.16 * tideLight(y, i)).toFixed(4) + ')');
    }
    tctx.fillStyle = vg;
    tctx.fillRect(0, 0, ex, TH);

    /* ② 内部棱在膜面上的横向暗带：只在最靠内的几道上（更靠外的已经在膜外了） */
    for(let j = 1; j < L.lines; j++){
      const dep = Math.max(0.10, 0.34 - (j - 1) * 0.09);
      tideRibbon(L, j, 12, 15 * spreadOf(envMid));
      tctx.fillStyle = 'rgba(146,168,192,' + (0.075 * dep * (0.5 + 0.5 * envMid)).toFixed(4) + ')';
      tctx.fill();
    }
    tctx.restore();
  }

  /* ============================================================
   波峰线：等距、平行、整体推进 —— 真实涌浪的招牌视觉
   ------------------------------------------------------------
   🔴 钟老师批「完全是静态的上下播放」。这一版修掉了三处：

   ① **每层只画 2 道线 = 五根竖面条。**
      真实涌浪在地平线上是一道接一道推过来的（surfertoday:
      "evenly spaced out, parallel lines of waves"），
      关键是**数量**—— 3~4 道才读得出「一列浪」，
      2 道只读得出「一根线旁边还有一根线」。
      → 每层 3~4 道，且间距按**几何级数**递减（透视：越靠内越远越密）。

   ② **只有 1.1 个波沿整根线起伏 → 看起来像「一根弯线在左右摆」。**
      加一个**长波、很慢**的分量（fs 0.45，sp 0.28）：
      它让整条线有一个大尺度的缓慢起伏，同时仍在沿 y 传播。
      这是「有东西在涌」与「线在摆」的分界。

   ③ **相位速度太慢，肉眼看不出来。**
      主频速度 ≈ 68px/s，8 秒只走过 550px ≈ 半个波长 ——
      盯着看也只像轻微颤动。主频提到 sp 1.05（≈137px/s），
      长波提到 0.28，两种速度叠在一起才是「在动」。

   内部线复用同一份波形与相位，只在 x 上按几何间距平移
   → 永远平行等距。越靠内的线越淡越窄（远水更平），
   最前那道最实（近岸 shoaling，浪最高）。
   ============================================================ */
  for(let i = 0; i < TIDE_LAYERS.length; i++){
    const L = TIDE_LAYERS[i];
    const envMid = tideSet(TH * 0.5, L.lag);
    /* 包络低时把外侧的宽晕收掉：lull 的浪不是「模糊」而是「薄」。 */
    /* 包络 → 带宽/影深 的统一缩放（膜面暗带 / 截面 / 层间投影共用） */
    const spread = spreadOf(envMid);

    /* j=0（最前那道）最后画 → 压在最上层，不被内部线抢掉 */
    for(let j = L.lines - 1; j >= 0; j--){
      const lead = (j === 0);
      /* 深度衰减：越靠内的波峰线越远、越淡、过渡带越窄。
         🔴 内部线只给 0.34 起、每道再降一档 —— 上一版给到 0.50，
            结果各条线一样实，读出来是「几根面条」而不是「一层水膜」。
            线是收口，面才是主体。 */
      const depth = lead ? 1 : Math.max(0.10, 0.34 - (j - 1) * 0.09);
      const kk = (1 - i * 0.15) * depth * (0.45 + 0.55 * envMid);
      if(kk <= 0.02) continue;

      const crestPath = () => {
        tctx.beginPath();
        for(let y = 0; y <= TH; y += TIDE_STEP){
          const x = tideCrest(L, y, hotW, j);
          if(y === 0) tctx.moveTo(x, y); else tctx.lineTo(x, y);
        }
      };

      /* ── 体积感：按「截面」逐道偏移填充 ──
         每道带用独立的偏移路径 → 受光面（-x）与背光面（+x）分开，
         棱线本身最亮。这是把「等宽灰带」变成「有厚度的棱」的关键。

         🔴 沿 y 的明暗必须用**ribbon 填充 + 纵向渐变**，
            不能用「分段描边」：分段描边会在接缝处两次叠加 alpha，
            整条棱变成一串珠子。填充则颜色处处连续，才读成光滑的棱。 */
      const sec = lead ? TIDE_SECTION_LEAD : TIDE_SECTION_SUB;
      for(let b = 0; b < sec.length; b++){
        const band = sec[b];
        const hw = band.w * 0.5 * spread;
        tideRibbon(L, j, band.dx, hw);
        tctx.fillStyle = tideBandGrad(band.c, band.a, i, kk);
        tctx.fill();
      }
      crestPath;   // 保留引用以便后续扩展（当前截面已包含收边亮棱）
    }

    /* ── 层间投影：这一层的棱在更远的膜面上投一道软影 ──
       画家算法下近的层后画 → 这道影自然压在远层的膜面上，
       层与层之间就有了前后关系（否则三层是三张贴在一起的纸）。 */
    if(i > 0){
      for(let b = 0; b < TIDE_CAST.length; b++){
        const cd = TIDE_CAST[b];
        tideRibbon(L, 0, cd.dx, cd.w * 0.5 * spread);
        tctx.fillStyle = tideBandGrad(cd.c, cd.a, i, envMid);
        tctx.fill();
      }
    }
  }
}

/* ---- 交互状态机 ----
   监听挂在 window 上而不是 #hot：
   #hot 未激活时是 pointer-events:none（不吃鼠标，左侧水面涟漪照常），
   挂在它自己身上永远收不到 pointermove。 */
function tideEnter(){
  if(tideOn) return;
  tideOn = true;
  hotEl.classList.add('on');
}
function tideExit(){
  if(!tideOn) return;
  tideOn = false;
  hotEl.classList.remove('on');
}

addEventListener('pointermove', function(e){
  /* 热区 = 左侧 1/4 屏。潮汐栏本身此刻可能只有 1/6~1/4 屏宽，
     但激活靠的是「鼠标在不在左 1/4」，不是「在不在这块 div 里」——
     否则栏宽一收窄，右边那截热区就永远进不去了。 */
  if(e.clientX < innerWidth * 0.25) tideEnter();
  else                             tideExit();
}, { passive:true });

/* 触屏没有 hover：点一下热区即展开，点外面收起。 */
addEventListener('pointerdown', function(e){
  if(e.clientX < innerWidth * 0.25) tideEnter();
  else                             tideExit();
}, { passive:true });

/* 窗口尺寸变化会改写 innerWidth*0.25 这个热区边界，
   重新判断一次当前鼠标是否还在热区里，避免 resize 后状态与画面不一致。 */
addEventListener('resize', function(){
  if(tideOn) tideExit();
});

resize();   // 首次 sizing：W / H 未定义前画布无法绘制

function drawSurface(now, T){
  const sw = sur.width, sh = sur.height;

  // 1. 铺底
  sctx.globalCompositeOperation = 'source-over';
  sctx.fillStyle = 'rgb(' + T.base[0] + ',' + T.base[1] + ',' + T.base[2] + ')';
  sctx.fillRect(0, 0, sw, sh);

  // 2. 斜向柔光：从左上到右下的一道宽而模糊的光带
  //    （光带而非全屏泛光，避免整片水面被提亮成白纸）
  const drift = Math.sin(now * SLOW) * 0.05;
  const g = sctx.createLinearGradient(
    -sw * 0.25 + sw * drift,
    -sh * 0.30 + sh * drift * 0.7,
     sw * 1.05 + sw * drift,
     sh * 0.95 + sh * drift * 0.7
  );
  g.addColorStop(0.00, rgba(T.sheen, 0));
  g.addColorStop(0.34, rgba(T.sheen, T.sheenA * 0.55));
  g.addColorStop(0.46, rgba(T.sheen, T.sheenA));
  g.addColorStop(0.58, rgba(T.sheen, T.sheenA * 0.55));
  g.addColorStop(1.00, rgba(T.sheen, 0));
  sctx.fillStyle = g;
  sctx.fillRect(0, 0, sw, sh);

  // 3. 极慢起伏：横向亮带 + 错相暗带，明暗交替
  //    静止时也能读出「这是液面在起伏」，而不是一张白纸
  const bands = 3;
  const bandH = sh * 0.20;
  for(let i = 0; i < bands; i++){
    const phase = now * SLOW + i * 2.1;

    // 波峰：亮带
    const y = sh * (0.22 + i * 0.28) + Math.sin(phase) * sh * 0.045;
    const bg = sctx.createLinearGradient(0, y - bandH, 0, y + bandH);
    bg.addColorStop(0.0, rgba(T.sheen, 0));
    bg.addColorStop(0.5, rgba(T.sheen, T.sheenA * 0.62));
    bg.addColorStop(1.0, rgba(T.sheen, 0));
    sctx.fillStyle = bg;
    sctx.fillRect(0, y - bandH, sw, bandH * 2);

    // 波谷：暗带（相位错开半步，形成明暗交替）
    const y2 = sh * (0.22 + i * 0.28) + Math.sin(phase + Math.PI) * sh * 0.045 + sh * 0.14;
    const sg = sctx.createLinearGradient(0, y2 - bandH, 0, y2 + bandH);
    sg.addColorStop(0.0, rgba(T.shade, 0));
    sg.addColorStop(0.5, rgba(T.shade, T.shadeA));
    sg.addColorStop(1.0, rgba(T.shade, 0));
    sctx.fillStyle = sg;
    sctx.fillRect(0, y2 - bandH, sw, bandH * 2);
  }

  // 贴回主画布（全分辨率）
  ctx.drawImage(sur, 0, 0, W, H);
}

/* 呼吸：极慢的一团柔光，几乎察觉不到 */
function drawBreath(now, T){
  const t = now * 0.00009;
  const cx = W * (0.5 + 0.22 * Math.sin(t));
  const cy = H * (0.5 + 0.18 * Math.cos(t * 0.8));
  const r  = Math.max(W, H) * (0.9 + 0.1 * Math.sin(t * 0.6));
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, rgba(T.breath, T.breathA));
  g.addColorStop(1, rgba(T.breath, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* 画一圈带明暗起伏的不规则波环
   用极坐标采样手工构造环带：沿角度 modulate 半径，
   得到轻微的椭圆 + 三瓣不规则，避免机械的正圆。 */
function wavePath(cx, cy, R, W_, phase, squish){
  ctx.beginPath();
  const STEPS = 96;
  for(let i = 0; i <= STEPS; i++){
    const a = i / STEPS * Math.PI * 2;
    const m = 1
      + Math.sin(a * 2 + phase) * 0.018          // 二瓣：椭圆
      + Math.sin(a * 3 - phase * 1.7) * 0.012     // 三瓣：轻微不规则
      + Math.sin(a * 5 + phase * 0.6) * 0.006;
    const rx = R * m * squish;
    const ry = R * m * (2 - squish);
    const x = cx + Math.cos(a) * rx;
    const y = cy + Math.sin(a) * ry;
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

/* 单个点源涟漪 = WAVES 个同心波，每个波有自己的滞后与衰减
   每个波内部：外沿高光 → 环顶 → 内侧凹陷（凹陷是体积感的关键）
   整体按光源方向做方向性着色，左上亮、右下暗 —— 这是「立体」而非「贴纸」的关键 */
function drawRipple(r, now, T){
  const t = (now - r.born) / LIFE;
  if(t >= 1) return false;

  const hi = T.ringHi;
  const lo = T.ringLo;
  const dim = (T.dim || 1) * (r.fade === undefined ? 1 : r.fade);
  const V = T.viscous || 0;   // 黏度：0 = 水，1 = 咖啡
  const M = T.matte || 0;     // 哑光度：0 = 镜面，1 = 全哑光
  const lx = Math.cos(LIGHT_DIR);   // 指向左上
  const ly = Math.sin(LIGHT_DIR);

  /* 黏度带来的三处物理差异（这是「像咖啡」而不是「像水」的关键）：
     1. 扩散慢   ease 指数从 2.6 降到 1.85，波峰推进更线性、更迟缓
     2. 波峰肥厚 环宽 ×(1+0.95V)，且高光带变宽变柔 —— 黏液没有清瘦的尖峰
     3. 耗散快   强度按指数衰减而非线性，尾巴短、不留残波 */
  const EASE_POW = 2.6 - 0.75 * V;
  const W_SCALE  = 1 + 0.95 * V + 1.15 * M;   // 哑光把波峰摊得更宽
  const DECAY    = 1 + 1.9 * V;                // 指数衰减的幂次

  /* 哑光的三处改动（M 插值，全部朝「没有镜面反射」走）：
     1. 峰更宽更钝  亮区起止位置外扩，峰值压低 —— 亮线摊成亮面
     2. 凹陷更深    体积感改由凹陷承担（哑光面本就不靠高光造型）
     3. 方向光影极弱 漫反射不挑方向，方向性要压到接近 0 */
  const PEAK   = 0.86 - 0.34 * V - 0.34 * M;   // 峰值亮度
  const LO_AMP = 1 - 0.42 * V + 0.30 * M;      // 凹陷相对强度（哑光下加重）
  const HI_A0  = 0.885 - 0.048 * V - 0.16 * M; // 亮区外沿（哑光外扩）
  const HI_A1  = 0.962 - 0.030 * V - 0.10 * M; // 峰位（哑光后移）
  const DIR_HI = 0.26 - 0.10 * V - 0.20 * M;   // 迎光侧高光
  const DIR_LO = 0.30 - 0.13 * V - 0.14 * M;   // 背光侧暗部

  // 同心波列
  // 关键：不要同时用「时间滞后」和「半径比例」两个手段去错开波。
  // 两者独立控制必然交叉（内圈波追平外圈波，视觉上又糊成一团）。
  // 这里只用半径偏移：所有波同步扩散，半径成固定比例，间距随扩散一起放大。
  // 「从里往外依次发出」的感觉由外圈的亮度爬升来表达，而不是挪时间。
  for(let w = 0; w < WAVES; w++){
    const frac = WAVES === 1 ? 1 : w / (WAVES - 1);      // 0 = 内圈, 1 = 外圈
    const Rmax = r.maxR * (R_INNER + (1 - R_INNER) * frac);
    const R = Rmax * (1 - Math.pow(1 - t, EASE_POW));   // 同步扩散
    if(R < 2) continue;

    // 环宽：黏液的波峰肥厚
    const W_ = Math.min((WAVE_W_MIN + R * 0.014) * W_SCALE, WAVE_W_MAX * 2.2);

    // 强度：外圈天然更弱；外圈在早期还没"爬出来"（t 越大越亮）
    let a;
    if(t < 0.06)      a = t / 0.06;
    else if(t < 0.18) a = 1;
    else              a = Math.pow(1 - (t - 0.18) / 0.82, DECAY);   // 指数衰减
    const appear = Math.max(0, Math.min(1, (t - frac * 0.16) / 0.22));   // 出发延迟
    a *= appear * (1.55 - frac * 0.55) * (r.boost || 1) * dim;
    if(a <= 0.012) continue;

    // 环带渐变：高光环 + 内侧凹陷（凹陷是体积感的关键）
    // 水的窄而锐、黏液的宽而钝、哑光的更宽更弱 —— 由 V / M 分别插值
    const g = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, R + W_);
    g.addColorStop(0.00, rgba(hi, 0));
    g.addColorStop(HI_A0, rgba(hi, 0));
    g.addColorStop(HI_A1, rgba(hi, a * PEAK));                 // 环顶
    g.addColorStop(HI_A1 + 0.020 * (1 + V), rgba(hi, a * 0.26));
    g.addColorStop(0.992 - 0.004 * V, rgba(lo, a * RING_SOFT * LO_AMP));  // 内侧凹陷
    g.addColorStop(1.00, rgba(lo, 0));

    wavePath(r.x, r.y, R, W_, r.phase + w * 1.3, r.squish);
    ctx.fillStyle = g;
    ctx.fill();

    // 方向性光影：迎光侧（左上）补一层高光，背光侧（右下）压一层暗
    // 这一层是「有体积」和「只是对称甜甜圈」的分界
    // 黏液的表面张力把光散开，哑光面则几乎完全漫反射 —— 两者都让它变弱
    ctx.save();
    ctx.clip();
    const lg = ctx.createRadialGradient(
      r.x + lx * R * 0.45, r.y + ly * R * 0.45, 0,
      r.x, r.y, R + W_
    );
    lg.addColorStop(0.00, rgba(hi, a * DIR_HI));
    lg.addColorStop(0.58, rgba(hi, 0));
    lg.addColorStop(1.00, rgba(lo, a * DIR_LO));
    ctx.fillStyle = lg;
    ctx.fillRect(r.x - R - W_ - 2, r.y - R - W_ - 2, (R + W_ + 2) * 2, (R + W_ + 2) * 2);
    ctx.restore();
  }

  // 撞击点：刚被压下去的中心凹陷，随后被弹平
  // 黏液的凹陷「弹不平」——愈合要慢得多，这正是咖啡那种挂杯的钝感
  const DF = DENT_FADE * (1 + V * 2.4);
  if(t < DF * 3){
    const dq = 1 - t / (DF * 3);
    const dR = r.maxR * 0.20 * dq;
    const da = dq * dq * 0.42 * (r.boost || 1) * dim;
    if(dR > 1 && da > 0.01){
      const dg = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, dR);
      dg.addColorStop(0.00, rgba(lo, da));
      dg.addColorStop(0.70, rgba(lo, da * 0.42));
      dg.addColorStop(1.00, rgba(lo, 0));
      ctx.beginPath();
      ctx.arc(r.x, r.y, dR, 0, Math.PI * 2);
      ctx.fillStyle = dg;
      ctx.fill();
    }
  }

  return true;
}

let prevT = 0;
function loop(now){
  const T = dark ? THEME.dark : THEME.light;

  /* 尺寸未就绪时直接跳过本帧，避免非有限值污染画布状态 */
  if(!W || !H || !isFinite(W) || !isFinite(H)){
    prevT = now;
    requestAnimationFrame(loop);
    return;
  }

  /* dt 要在尺寸校验之后再算：resize 之后第一帧的间隔可能长达几百毫秒，
     直接拿去乘指数逼近会让栏宽「跳」一下。夹到 50ms 上限即可。 */
  const dt = prevT ? Math.min(50, now - prevT) : 16;
  prevT = now;

  drawTide(now, dt);
  drawSurface(now, T);
  drawBreath(now, T);

  /* 两种材质的交互完全不同，走两套渲染：
     浅色 = 水 → 同心圆涟漪
     深色 = 丝 → 高度场布面（抓住一角拖动，褶皱连成一片）*/
  if(dark){
    relaxCloth(now);       // 布的柔性（停止移动 F_FREEZE 后完全静止）
    drawCloth(now, T);     // 浮雕光照
  }else{
    // 密度闸门：一个涟漪现在有 5 道波，占的面积是单环的 5 倍。
  // 快速划动时若不设上限，波会叠成一团白糊。
    // 超出上限时让最老的涟漪提前退场（fade），而不是粗暴删除。
    const MAX_ALIVE = 9;
    if(ripples.length > MAX_ALIVE){
      let extra = ripples.length - MAX_ALIVE;
      for(let i = 0; i < ripples.length && extra > 0; i++){
        const r = ripples[i];
        const age = now - r.born;
        // 已过 45% 生命周期的可以安全提前退场
        if(age > LIFE * 0.45){ r.dying = now; extra--; }
      }
    }

    for(let i = ripples.length - 1; i >= 0; i--){
      const r = ripples[i];
      // 退场中的涟漪：用 420ms 淡出，而不是突然消失
      if(r.dying){
        const k = 1 - (now - r.dying) / 420;
        if(k <= 0){ ripples.splice(i, 1); continue; }
        r.fade = k;
      } else {
        r.fade = 1;
      }
      if(!drawRipple(r, now, T)) ripples.splice(i, 1);
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 指针：鼠标 / 触摸 / 触控笔走同一入口。

   两种材质走两套交互：
     浅色（水）→ 每移动 28px 生成一圈同心圆涟漪
     深色（丝）→ 布面被推起：沿移动路径连续叠加隆起，褶皱连成一片 */

cvs.addEventListener('pointermove', function(e){
  const x = e.clientX, y = e.clientY;

  if(lastX === null){
    lastX = x; lastY = y;
    /* 深色模式**不在这里建隆起**。
       首次进入时还没有方向，只能硬编码一个 —— 而那一团的底座方向
       与后续真实推移方向不一致，起点就会跳出一块与轨迹垂直的硬边
       （探针实测：起点 +4px 处高度从 0 直接跳到 0.43）。
       只记位置，等第二个点拿到真实方向后再由下面的路径采样统一建。 */
    if(!dark) spawn(x, y, 1);
    return;
  }

  const dx = x - lastX, dy = y - lastY;
  const moved = Math.hypot(dx, dy);
  const now = performance.now();
  if(moved < 1) return;

  /* 推移方向做平滑：布面褶皱的朝向跟着推移方向转，方向抖一下整片布就跟着歪一下，很假。

   🔴 平滑时必须防退化：180° 折返的瞬间 dir 与新方向几乎反向，
      `dirX + ndx*0.5` 的模长趋近 0，归一化后会产生一个**任意方向**
      的垃圾向量（探针实测：折返点处冒出 63 次 `0,1` 垂直方向的调用）。
      而底座是 260px 长条，一条垂直底座横在水平轨迹上 → 一块硬边。
      修法：模长太小时直接用新方向，不要归一化。 */
  let ndx = dx / moved, ndy = dy / moved;
  const dot = ndx * dirX + ndy * dirY;
  if(dot > 0.5){
    const px = dirX + ndx * 0.5, py = dirY + ndy * 0.5;
    const pl = Math.hypot(px, py);
    if(pl > 0.35){ dirX = px / pl; dirY = py / pl; }   // 接近反向 → 放弃平滑
    else { dirX = ndx; dirY = ndy; }
  } else {
    dirX = ndx; dirY = ndy;   // 反向 / 大幅转向：直接换向
  }

  if(dark){
    const sp = Math.min(2.4, moved / Math.max(8, now - (foldLastT || now - 16)));
    foldLastT = now;

    /* 连续抬升：沿着这一段实际走过的路径细分，逐点叠加褶脊。
       细分间距带随机抖动 —— 等距堆积会得到「百叶窗」一样的规整条纹。
       步长必须 > 褶脊半厚，否则相邻褶脊叠满、谷被填平，
       布面就退化成一条光滑的凸起（这是最容易踩的坑）。 */
    const STEP = F_STEP * (0.62 + Math.random() * 0.72);
    const segs = Math.min(48, Math.max(1, Math.round(moved / STEP)));
    for(let s = 1; s <= segs; s++){
      const tt = s / segs;
      liftCloth(lastX + dx * tt, lastY + dy * tt, dirX, dirY, sp);
    }

    lastX = x; lastY = y;
  }else{
    if(moved >= GAP){
      spawn(x, y, 1);
      lastX = x; lastY = y;
    }
  }
}, { passive:true });

/* 按下即刻给一圈涟漪 / 顶起一块布。
   触屏上「点一下」只有 pointerdown/up、没有位移，
   只监听 pointermove 的话手机上点按完全没反应 —— 必须补这一条。 */
cvs.addEventListener('pointerdown', function(e){
  if(dark) liftCloth(e.clientX, e.clientY, dirX, dirY, 0.35);
  else      spawn(e.clientX, e.clientY, 1);
  lastX = e.clientX; lastY = e.clientY;
  foldLastT = performance.now();
}, { passive:true });

cvs.addEventListener('pointerleave', function(){
  lastX = null;
  lastY = null;
});

/* 保底验证：打开后 600ms，中央自动来一圈 / 顶起一小条布
   （深色模式是丝绸，给的是一次很轻的布面隆起） */
setTimeout(function(){
  if(dark){ clothBorn = performance.now(); liftCloth(W / 2, H / 2, 0, 1, 0.30); }
  else      spawn(W / 2, H / 2, 1.7);
}, 600);

/* 切换明暗：两套交互的残留数据要各自清掉，
   否则从水切到丝会看到一圈同心圆凭空出现在丝上面 */
document.getElementById('btn').onclick = function(){
  dark = !dark;
  document.body.classList.toggle('dark', dark);
  ripples.length = 0;      // 清掉水的涟漪
  clearField();            // 清掉丝的隆起
  clothBorn = performance.now();
  lastX = null; lastY = null;
};
</script>

<!-- DOM 工具：所有板块建节点都走它，不拼 HTML 字符串 -->
<script>
/* ============================================================================
   UFEEL · DOM 小工具
   ----------------------------------------------------------------------------
   全部走 createElement / textContent，不拼 HTML 字符串。
   手账和对话里的文字是用户自己写的，一旦走 innerHTML 就等于把转义责任
   推给了每个调用点 —— 迟早会漏一处。这里从源头上不给这个机会。
   ========================================================================== */
window.UFeel = window.UFeel || {};

(function(){
  'use strict';

  /* el('div.card', { text:'…' }, [el('p', …)])
     tag 支持 'div.cls.cls2' 简写；props.on 里的键直接当事件名绑定。 */
  function el(tag, props, children){
    const parts = String(tag).split('.');
    const node = document.createElement(parts[0]);
    if(parts.length > 1) node.className = parts.slice(1).join(' ');

    if(props){
      for(const k in props){
        const v = props[k];
        if(v === null || v === undefined || v === false) continue;
        if(k === 'text')      node.textContent = v;
        else if(k === 'class') node.className = (node.className ? node.className + ' ' : '') + v;
        else if(k === 'on')   { for(const ev in v) node.addEventListener(ev, v[ev]); }
        else if(k === 'style'){ if(typeof v === 'string') node.style.cssText = v;
                                else for(const s in v) node.style[s] = v[s]; }
        else if(k === 'data') { for(const d in v) node.dataset[d] = v[d]; }
        else                  node.setAttribute(k, v === true ? '' : v);
      }
    }

    append(node, children);
    return node;
  }

  function append(node, children){
    if(children === null || children === undefined) return node;
    if(Array.isArray(children)) children.forEach(c => append(node, c));
    else if(children instanceof Node) node.appendChild(children);
    else node.appendChild(document.createTextNode(String(children)));
    return node;
  }

  const clear = node => { while(node.firstChild) node.removeChild(node.firstChild); return node; };

  /* 提示条：全局只有一个，重复调用就替换文字并重新计时 */
  let toastEl = null, toastTimer = 0;
  function toast(msg, ms){
    if(!toastEl){
      toastEl = el('div.toast', { role:'status' });
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('in');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('in'), ms || 2600);
  }

  /* 本地时间：存的是 ISO，展示要回到用户所在时区，不能用 toISOString 切片 */
  function fmtDate(iso){
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fmtTime(iso){
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtRel(iso){
    const diff = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diff / 60000);
    if(min < 1)  return '刚刚';
