    if(min < 60) return min + ' 分钟前';
    const hr = Math.floor(min / 60);
    if(hr < 24)  return hr + ' 小时前';
    const day = Math.floor(hr / 24);
    if(day < 30) return day + ' 天前';
    return fmtDate(iso);
  }

  UFeel.el = el;
  UFeel.append = append;
  UFeel.clear = clear;
  UFeel.toast = toast;
  UFeel.fmtDate = fmtDate;
  UFeel.fmtTime = fmtTime;
  UFeel.fmtRel = fmtRel;
})();
</script>

<!-- 数据层：store 管本地状态，api 管后端（连不上自动落 mock） -->
<script>
/* ============================================================================
   UFEEL · 本地状态
   ----------------------------------------------------------------------------
   第一版不引框架。所有板块共用这一份状态，改动通过 emit 广播。

   存储策略：localStorage 打底，后端可用时以服务端为准（见 api.js）。
   这样做的理由很实际 —— 后端没起来时页面照样能点通，
   演示 / 断网 / 只双击 index.html 都不至于白屏。
   ========================================================================== */
window.UFeel = window.UFeel || {};
UFeel.pages = UFeel.pages || {};

(function(){
  'use strict';

  const NS = 'ufeel.v1';
  const K  = k => NS + ':' + k;

  /* localStorage 在隐私窗口 / 禁用站点数据时会直接抛异常。
     读写一律包 try，失败就退回内存态，绝不让存储问题把页面打挂。 */
  function read(k, dflt){
    try{
      const s = localStorage.getItem(K(k));
      return s === null ? dflt : JSON.parse(s);
    }catch(e){ return dflt; }
  }
  function write(k, v){
    try{ localStorage.setItem(K(k), JSON.stringify(v)); }catch(e){}
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const nowISO = () => new Date().toISOString();

  /* 心情标签。刻意不区分「正面 / 负面」——
     产品立场是不评判，颜色只用来区分，不用来表达好坏。 */
  const MOODS = [
    { id:'calm',    name:'平静',   hex:'#9DB4A8' },
    { id:'low',     name:'低落',   hex:'#8A93A8' },
    { id:'anxious', name:'焦虑',   hex:'#B9A48C' },
    { id:'angry',   name:'生气',   hex:'#B08A82' },
    { id:'tired',   name:'疲惫',   hex:'#A79EA6' },
    { id:'unclear', name:'说不清', hex:'#A8A8A3' }
  ];
  const moodOf = id => MOODS.find(m => m.id === id) || MOODS[5];

  /* 长期记忆的四个分层。分层本身就是隐私保障的第一重：
     用户能看见「AI 到底把我按哪个维度记住了」。 */
  const LAYERS = [
    { id:'about',   name:'关于我' },
    { id:'people',  name:'重要的人' },
    { id:'ongoing', name:'正在经历' },
    { id:'prefer',  name:'偏好' }
  ];
  const layerOf = id => LAYERS.find(l => l.id === id) || LAYERS[0];

  const DEFAULTS = {
    settings:{
      ageBand:'unset',              // unset | under18 | 18-25 | over25
      model:'auto',                 // auto | deepseek | gemini
      community:false,              // 社区默认关，用户自主选择
      crisisSupport:true,           // 风险预警与夜间客服通道
      ripples:true,                 // 涟漪效果（关掉后水面完全静止）
      privacy:{
        longTermMemory:true,        // 总开关
        diaryToMemory:false,        // 🔴 默认不记：手账不自动进记忆
        keepTranscript:true         // 对话原文是否留存
      }
    },
    credits:{ balance:0, ledger:[] },
    diary:[],
    memory:[],
    chat:[],
    course:{ done:[] }              // 已完成的微课 id
  };

  const state = {
    settings: Object.assign({}, DEFAULTS.settings, read('settings', {})),
    credits : Object.assign({}, DEFAULTS.credits,  read('credits',  {})),
    diary   : read('diary',  []),
    memory  : read('memory', []),
    chat    : read('chat',   []),
    course  : Object.assign({}, DEFAULTS.course, read('course', {}))
  };
  /* privacy 是嵌套对象，浅合并会把用户改过的开关整个换掉，单独再合一层 */
  state.settings.privacy = Object.assign({},
    DEFAULTS.settings.privacy, (read('settings', {}).privacy) || {});

  /* ---- 事件 ---- */
  const subs = {};
  function on(evt, fn){ (subs[evt] = subs[evt] || []).push(fn); return () => off(evt, fn); }
  function off(evt, fn){ const a = subs[evt]; if(a) subs[evt] = a.filter(f => f !== fn); }
  function emit(evt, payload){ (subs[evt] || []).forEach(fn => { try{ fn(payload); }catch(e){ console.error(e); } }); }

  /* ---- 持久化 ---- */
  function save(key){
    if(key) write(key, state[key]);
    else ['settings','credits','diary','memory','chat','course'].forEach(k => write(k, state[k]));
    emit('save', key);
  }

  /* ---- 手账 ---- */
  function addDiary(entry){
    const e = Object.assign({
      id: uid(), at: nowISO(), mood:'unclear', intensity:3, remember:false
    }, entry);
    state.diary.unshift(e);
    save('diary');
    /* 封存时就开着「让它记住」的，在这里一次炼成长期记忆。
       收在 store 里做，而不是指望调用方补一次 setDiaryRemember ——
       漏一次就会出现「开关是开的、但 AI 其实没记住」这种骗人的状态。 */
    if(e.remember) addMemory({ layer:'ongoing', text:e.text, source:'diary', sourceId:e.id });
    emit('diary', state.diary);
    return e;
  }
  function removeDiary(id){
    state.diary = state.diary.filter(d => d.id !== id);
    save('diary'); emit('diary', state.diary);
  }
  function setDiaryRemember(id, remember){
    const e = state.diary.find(d => d.id === id);
    if(!e) return;
    e.remember = remember;
    save('diary');
    /* 打开「让它记住」时，把这条炼成一条长期记忆；关掉时把对应的记忆一并撤掉。
       两边必须联动，否则用户关了开关却发现 AI 还记得，那就是欺骗。 */
    if(remember) addMemory({ layer:'ongoing', text:e.text, source:'diary', sourceId:e.id });
    else removeMemoryBySource(e.id);
    emit('diary', state.diary);
  }

  /* ---- 长期记忆 ---- */
  function addMemory(item){
    const m = Object.assign({ id: uid(), at: nowISO(), layer:'about' }, item);
    state.memory.unshift(m);
    save('memory'); emit('memory', state.memory);
    return m;
  }
  function updateMemory(id, text){
    const m = state.memory.find(x => x.id === id);
    if(!m) return;
    m.text = text; m.edited = true; m.at = nowISO();
    save('memory'); emit('memory', state.memory);
  }
  function removeMemory(id){
    state.memory = state.memory.filter(m => m.id !== id);
    save('memory'); emit('memory', state.memory);
  }
  function removeMemoryBySource(sourceId){
    const before = state.memory.length;
    state.memory = state.memory.filter(m => m.sourceId !== sourceId);
    if(state.memory.length !== before){ save('memory'); emit('memory', state.memory); }
  }

  /* ---- 对话 ---- */
  function addChat(msg){
    const m = Object.assign({ id: uid(), at: nowISO(), role:'me' }, msg);
    state.chat.push(m);
    /* 「对话原文是否留存」关掉时，只保留在内存里供本次会话渲染，
       不落盘 —— 用户关的是一个持久化开关，不是「AI 立刻失忆」。 */
    if(state.settings.privacy.keepTranscript) save('chat');
    emit('chat', state.chat);
    return m;
  }
  function clearChat(){
    state.chat = []; save('chat'); emit('chat', state.chat);
  }

  /* ---- 积分 ---- */
  function spend(n, reason){
    if(state.credits.balance < n) return false;
    state.credits.balance -= n;
    state.credits.ledger.unshift({ id: uid(), at: nowISO(), delta: -n, reason: reason || '深度模式' });
    save('credits'); emit('credits', state.credits);
    return true;
  }
  function earn(n, reason){
    state.credits.balance += n;
    state.credits.ledger.unshift({ id: uid(), at: nowISO(), delta: n, reason: reason || '签到' });
    save('credits'); emit('credits', state.credits);
  }

  /* ---- 设置 ---- */
  function setSetting(path, value){
    const seg = path.split('.');
    let o = state.settings;
    for(let i = 0; i < seg.length - 1; i++) o = o[seg[i]];
    o[seg[seg.length - 1]] = value;
    save('settings'); emit('settings', state.settings);
  }

  /* ---- 派生数据（回顾页要用）---- */
  function reviewStats(days){
    const n = days || 30;
    const since = Date.now() - n * 86400000;
    const items = state.diary.filter(d => new Date(d.at).getTime() >= since);
    const byDay = {};
    items.forEach(d => {
      const k = d.at.slice(0, 10);
      (byDay[k] = byDay[k] || []).push(d);
    });

    /* 连续记录天数：从今天往回数，断一天就停。不做补签，不制造打卡压力。 */
    let streak = 0;
    for(let i = 0; i < 400; i++){
      const k = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
      if(byDay[k]) streak++;
      else if(i > 0) break;
    }

    const moodCount = {};
    items.forEach(d => { moodCount[d.mood] = (moodCount[d.mood] || 0) + 1; });

    return { total: items.length, all: state.diary.length, streak, byDay, moodCount, items };
  }

  function wipeAll(){
    state.diary = []; state.memory = []; state.chat = [];
    state.credits = { balance: 0, ledger: [] };
    state.course = { done: [] };
    state.settings = JSON.parse(JSON.stringify(DEFAULTS.settings));
    save();
    emit('diary', []); emit('memory', []); emit('chat', []);
    emit('credits', state.credits); emit('settings', state.settings);
  }

  UFeel.store = {
    state, MOODS, moodOf, LAYERS, layerOf, DEFAULTS,
    on, off, emit, save,
    uid, nowISO,
    addDiary, removeDiary, setDiaryRemember,
    addMemory, updateMemory, removeMemory, removeMemoryBySource,
    addChat, clearChat,
    spend, earn, setSetting,
    reviewStats, wipeAll
  };
})();
</script>
<script>
/* ============================================================================
   UFEEL · 后端桥接
   ----------------------------------------------------------------------------
   所有后端调用只出现在这一层。页面永远拿到的都是「一次普通的异步调用」，
   不需要知道对面是真实模型、是 Mock、还是压根连不上。

   降级策略：探活失败 → 全程走本地 mock，并在界面上如实标注「本地演示模式」。
   产品立场里写了「要诚实不要假装是人」，那么没接上模型这件事也必须说出来，
   不能让用户以为自己正在被一个真的模型听着。
   ========================================================================== */
window.UFeel = window.UFeel || {};

(function(){
  'use strict';

  const BASE = '';                 /* 与前端同源，后端启动时即是 */
  let alive = null;                /* null=未知 / true / false */

  const j = async (path, opts) => {
    const r = await fetch(BASE + path, Object.assign({
      headers: { 'Content-Type': 'application/json' }
    }, opts));
    if(!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.json();
  };

  /* ---- 探活：只做一次，结果缓存 ---- */
  async function probe(){
    if(alive !== null) return alive;

    /* 用 file:// 双击打开的单文件版没有后端可探，也不该去 fetch 一个
       根本不存在的 file:///api/health —— 那只会往控制台丢一条没意义的报错。
       直接判定为本地模式，后面所有调用都会走 mock。 */
    if(location.protocol === 'file:'){ alive = false; return alive; }

    try{
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 2500);
      const r = await fetch(BASE + '/api/health', { signal: ctl.signal });
      clearTimeout(t);
      alive = r.ok;
    }catch(e){
      alive = false;
    }
    return alive;
  }
  const isLocal = () => alive === false;

  /* ==========================================================================
     本地 mock —— 不是「假装模型」，是一套有明确立场的规则化回应
     ------------------------------------------------------------------------
     刻意实现的几件事：
       1. 三段式节奏：先接住情绪 → 复述确认 → 问过用户才给建议。
          这直接对应问卷里「被理解共情 > 被认真听完 > 具体建议」的排序。
       2. 被问「你是不是 AI」时直接承认，不绕。
       3. 不追问细节、不评判、不说「你想开点」这类否定情绪的话。
     ====================================================================== */
  const AI_DISCLOSURE =
    '我是 AI，不是真人。我的回应有些是照着规则来的，会比真人机械。\n' +
    '我不会假装是人 —— 如果这里让你觉得比跟真人说话轻松，那多半是因为我不会累、' +
    '不会评判你，而不是因为我更懂你。\n' +
    '真正能陪你在现实里走下去的，还是你身边的人。我更像一个随时能说话的地方。';

  /* 情绪词 → 一句「接住」的话。只做识别，不做诊断。 */
  const SIGNALS = [
    { k:['累','疲惫','撑不住','耗尽','没力气'], say:'你听起来已经很累了，而且是累了很久的那种。' },
    { k:['委屈','不公平','凭什么'],             say:'这件事让你觉得委屈，好像是你的付出没有被看见。' },
    { k:['焦虑','紧张','慌','不安','睡不着'],   say:'你现在是绷着的，身体可能比脑子更早感觉到。' },
    { k:['生气','愤怒','气死','烦'],            say:'你生气了。生气通常是因为有个东西对你不公平。' },
    { k:['难过','想哭','伤心','低落'],          say:'你现在很难过。' },
    { k:['孤独','没人','一个人','没人懂'],      say:'你觉得身边没有能说话的人，这种孤独很具体。' },
    { k:['不知道','说不清','乱'],               say:'说不清也没关系，不用先把情绪整理好才能开口。' }
  ];

  const BAN = /(想开点|别多想|没什么大不了|你要坚强|加油就好了|都是为你好)/;

  function mockReply(text, history){
    const t = text || '';
    const selfAsk = /(你是|是不是)(AI|ai|机器人|人工智能|真人|人吗)/.test(t);
    if(selfAsk) return AI_DISCLOSURE;

    /* 用户明确要建议时才给建议，否则只接住 + 问一句。
       这条规则就是产品对「套路化 AI」的正面回答：不抢着解决问题。 */
    const wantsAdvice = /(怎么办|该不该|怎么才能|有什么办法|给我点建议)/.test(t);

    const hit = SIGNALS.find(s => s.k.some(k => t.includes(k)));
    const open = hit ? hit.say : '我在听。你说吧，不用先想好怎么讲。';

    /* 复述确认：把用户的话原样递回去一小段，让他知道「被听清了」而不是「被回复了」 */
    const frag = t.replace(/\s+/g, '').slice(0, 26);
    const echo = frag ? '你刚才说「' + frag + (t.replace(/\s+/g,'').length > 26 ? '…' : '') + '」。' : '';

    const ask = wantsAdvice
      ? '你想要的是具体办法，还是先有人陪着把这口气顺过来？两种我都可以，但想按你的节奏来。'
      : '这件事你跟别人讲过吗？如果讲不出口，也可以就先放在这儿。';

    let out = open + '\n' + echo + ask;
    if(BAN.test(out)) out = out.replace(BAN, '');
    return out;
  }

  /* 逐字吐出来，让本地模式的观感和真实流式一致 */
  async function mockStream(text, onToken, signal){
    const chunks = text.match(/[\s\S]{1,3}/g) || [];
    for(const c of chunks){
      if(signal && signal.aborted) return;
      await new Promise(r => setTimeout(r, 26));
      onToken(c);
    }
  }

  /* ---- SSE 解析：后端按 `data: {"t":"..."}` 逐块下发，末尾 data: [DONE] ---- */
  async function readSSE(res, onToken, onMeta){
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for(;;){
      const { done, value } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if(!payload || payload === '[DONE]') continue;
        try{
          const o = JSON.parse(payload);
          if(o.t) onToken(o.t);
          if(o.meta && onMeta) onMeta(o.meta);
        }catch(e){ /* 单行解析失败不该中断整段回复 */ }
      }
    }
  }

  /* ==========================================================================
     对外的 API
     ====================================================================== */

  /* 发一句话前先过一遍闸门：脱敏 + 风险分级。
     必须放在发送之前 —— 一旦原文已经上传，再提示就晚了。 */
  async function scan(text){
    if(await probe()){
      try{ return await j('/api/safety/scan', { method:'POST', body: JSON.stringify({ text }) }); }
      catch(e){ /* 落到本地规则 */ }
    }
    return localScan(text);
  }

  /* 本地脱敏闸门。后端那份是权威，这份保证离线也有同样的保护。 */
  const PATTERNS = [
    { id:'idcard', name:'身份证号', re:/\b\d{17}[\dXx]\b/ },
    { id:'bank',   name:'银行卡号', re:/\b\d{16,19}\b/ },
    { id:'phone',  name:'手机号',   re:/\b1[3-9]\d{9}\b/ },
    { id:'email',  name:'邮箱',     re:/[\w.+-]+@[\w-]+\.[\w.]+/ }
  ];
  const RISK = /(不想活|活不下去|自杀|自残|死了算了|结束生命|没有意义了)/;

  function localScan(text){
    const hits = PATTERNS.filter(p => p.re.test(text)).map(p => ({ id:p.id, name:p.name }));
    return {
      blocked: hits.length > 0,
      hits,
      level: RISK.test(text) ? 'high' : 'none',
      note: hits.length ? '这段里像是含了' + hits.map(h => h.name).join('、') + '，不建议发出来。' : ''
    };
  }

  /* 长期记忆随请求一起带给后端，服务端不存 —— 所以这里每次都要带上。
     用户刚在「记忆」页删掉的东西，下一次请求就已经不在了，
     不存在「服务端还留着一份」的窗口期。 */
  function memoryPayload(){
    try{
      return UFeel.store.state.memory.map(m =>
        ({ id:m.id, layer:m.layer, text:m.text, at:m.at, source:m.source || null }));
    }catch(e){ return []; }
  }

  /* 主对话。onToken 逐字回调，onMeta 收风险等级等元信息。 */
  async function chat(messages, { onToken, onMeta, signal } = {}){
    if(await probe()){
      try{
        const res = await fetch(BASE + '/api/chat', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ messages, memories: memoryPayload() }),
          signal
        });
        if(!res.ok) throw new Error('chat ' + res.status);
        await readSSE(res, onToken, onMeta);
        return { local:false };
      }catch(e){
        if(e.name === 'AbortError') return { local:false, aborted:true };
        /* 后端中途挂了 —— 不弹错误框，静默落到本地，别打断正在说话的人 */
      }
    }
    const last = messages[messages.length - 1];
    if(onMeta) onMeta({ local:true, level: localScan(last ? last.content : '').level });
    await mockStream(mockReply(last ? last.content : '', messages), onToken, signal);
    return { local:true };
  }

  /* 深度模式：多视角并行。走积分，但基础陪伴不受影响。 */
  async function panorama(messages){
    if(await probe()){
      try{
        return await j('/api/chat/panorama', {
          method:'POST',
          body: JSON.stringify({ messages, memories: memoryPayload() })
        });
      }catch(e){}
    }
    const last = messages[messages.length - 1];
    const base = mockReply(last ? last.content : '', messages);
    return { local:true, views:[
      { name:'被听见的那一面', text: base },
      { name:'换个角度的看法', text: '同一件事，如果放在一年后回头看，可能只占很小一块。\n这不是要你现在就把它看小，只是留个参照。' },
      { name:'身体先说的话',   text: '情绪常常先在身体上出现 —— 睡不好、吃不下、肩膀一直是紧的。\n今晚可以先只管一件事：让自己睡够。' }
    ]};
  }

  /* 申诉是唯一一个把内容交给服务端的入口 —— 因为它本来就是要给人看的。
     心事、记忆、对话原文全部留在本机，服务端既不接收也不存储。
     这不是「暂时没做」，是设计：少存一份，就少一个泄露面。 */
  async function appeal(text){
    if(!(await probe())) return null;
    try{ return await j('/api/memory/appeal', { method:'POST', body: JSON.stringify({ text }) }); }
    catch(e){ return null; }
  }

  UFeel.api = { probe, isLocal, chat, panorama, scan, localScan, appeal };
})();
</script>

<!-- 涟漪总控：包装 water.js 的 spawn/liftCloth 做总开关，
     并让板块页也有一份稀疏的涟漪。必须排在 store.js 之后（要读设置）。 -->
<script>
/* ============================================================================
   UFEEL · 涟漪总控
   ----------------------------------------------------------------------------
   管两件事，都不需要动 water.js：

   1. 涟漪效果的总开关
      water.js 里是 `spawn(...)` 这种裸调用。顶层函数声明会把绑定挂到
      window 上（不像 let/const 那样只进全局词法环境），所以替换
      window.spawn 就能拦住它**每一次**触发 —— 水面拖动、点击、
      以及开页面时那圈保底涟漪，全都从这里过。
      深色模式的丝绸隆起走 liftCloth，同理一起包。

   2. 板块页也留一点涟漪，但稀疏得多
      面板铺在画布之上，指针事件到不了 #c，water.js 那一套在板块页里
      整个失效 —— 开着板块时水面是死的。这里自己听一次 window 的
      pointermove，用比 GAP(28px) 大得多的间距手动触发。

      为什么不是照搬 28px：面板上密集的涟漪不会变成「活气」，
      只会变成噪声 —— 用户的注意力在正文上，底下一直在泛光反而干扰。
      所以间距放到 130px（约四分之一的密度），强度也压一点。
   ========================================================================== */
(function(){
  'use strict';

  /* 正常情况下 water.js 排在本文件前面。没拿到就什么都别做，
     免得把页面搞成一个半死的状态。 */
  if(typeof spawn !== 'function' || typeof liftCloth !== 'function') return;

  const S = UFeel.store;
  const stage = document.getElementById('stage');

  /* 面板上的触发间距。水面上是 28px。 */
  const PANEL_GAP = 130;
  /* 面板上涟漪的强度。面板本身有一层毛玻璃，太亮会糊成一片。 */
  const PANEL_BOOST = 0.85;

  let on = S.state.settings.ripples !== false;
  let lastX = null, lastY = null;

  /* 先把原函数抓在手里，再替换 —— 包装函数里要调的是「原来那个」，
     否则会调到自己，无限递归。 */
  const origSpawn = spawn;
  const origLift  = liftCloth;

  window.spawn = function(x, y, boost){
    if(!on) return;
    return origSpawn(x, y, boost);
  };
  window.liftCloth = function(x, y, dx, dy, speed){
    if(!on) return;
    return origLift(x, y, dx, dy, speed);
  };

  /* 指针是不是落在面板上。
     落在水面上时不接管 —— 那种情况 #c 能收到事件，water.js 会按它自己的
     28px 处理；这里再插一脚会变成双倍密度，反而更乱。 */
  function overPanel(e){
    return !!(e.target && stage.contains(e.target));
  }

  function onMove(e){
    if(!on || !stage.classList.contains('open') || !overPanel(e)){
      /* 离开接管区域就把锚点清掉，回来时重新起算 ——
         否则会拿一个很久以前的坐标去比距离，凭空冒出一圈。 */
      lastX = lastY = null;
      return;
    }

    const x = e.clientX, y = e.clientY;
    if(lastX === null){ lastX = x; lastY = y; return; }
    if(Math.hypot(x - lastX, y - lastY) < PANEL_GAP) return;

    lastX = x; lastY = y;
    origSpawn(x, y, PANEL_BOOST);
  }

  addEventListener('pointermove', onMove, { passive:true });

  function set(v){
    on = !!v;
    if(!on){
      /* 关掉时要把已经在飘的涟漪清掉。只拦新的是不够的 ——
         否则会看到「关了开关，还剩几圈在那儿扩散」，像没关干净。
         ripples 是 const 数组，不能重新赋值，原地清空长度即可。 */
      try{ ripples.length = 0; }catch(e){}
      try{ clearField(); }catch(e){}
      lastX = lastY = null;
    }
  }

  /* 设置页改的是 store，这里跟着同步。
     走订阅而不是让设置页直接调 set()，是为了让「改设置」和「生效」
     只有一条路径 —— 以后再加别的地方改这个值，也不会漏掉。 */
  S.on('settings', () => set(S.state.settings.ripples !== false));
  set(on);

  UFeel.ripple = { isOn: () => on, set, PANEL_GAP };
})();
</script>

<!-- 六个板块，各自注册到 UFeel.pages -->
<script>
/* ============================================================================
   板块 · 回顾
   ----------------------------------------------------------------------------
   画的是「这些天你说了多少」，不是「这些天你有多开心」。

   这个选择是刻意的：一旦把情绪折算成一条「越高越好」的曲线，产品就开始
   给用户的情绪打分了 —— 而那正是我们要避免的事。所以纵轴是记录条数
   （中性的行为量），心情只做分布展示，不排序、不排名、不标好坏。
   ========================================================================== */
(function(){
  'use strict';

  const { el, clear, fmtDate } = UFeel;

  const W = 600, H = 150, PAD = 16;     // SVG 局部坐标系，靠 CSS 缩放到容器宽

  let unsubs = [];

  /* 近 n 天，每天一条计数的序列 */
  function series(days){
    const out = [];
    const base = new Date();
    base.setHours(0, 0, 0, 0);
    for(let i = days - 1; i >= 0; i--){
      const d = new Date(base.getTime() - i * 86400000);
      const k = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      out.push({ key:k, date:d, n:0 });
    }
    return out;
  }

  /* 平滑折线：用中点做二次贝塞尔过渡，避免直线折角。
     不用 Catmull-Rom —— 数据点稀疏时它会在谷底过冲，画出并不存在的低谷。 */
  function smoothPath(pts){
    if(!pts.length) return '';
    if(pts.length < 3) return 'M' + pts.map(p => p[0] + ' ' + p[1]).join('L');
    let d = 'M' + pts[0][0] + ' ' + pts[0][1];
    for(let i = 1; i < pts.length - 1; i++){
      const mx = (pts[i][0] + pts[i + 1][0]) / 2;
      const my = (pts[i][1] + pts[i + 1][1]) / 2;
      d += 'Q' + pts[i][0] + ' ' + pts[i][1] + ' ' + mx + ' ' + my;
    }
    const last = pts[pts.length - 1];
    return d + 'L' + last[0] + ' ' + last[1];
  }

  function mount(root, ctx){
    const S = UFeel.store;

    /* 整页可重入：手账那边一有改动就重画，而不是去 reopen 一次
       （reopen 会被 shell 的早退判掉，等于什么都没发生）。 */
    function render(){
      clear(root);

      const stats = S.reviewStats(30);

      /* ---- 数字格 ---- */
      const moodTop = Object.entries(stats.moodCount).sort((a, b) => b[1] - a[1])[0];
      root.appendChild(el('div.stats', null, [
        el('div.stat', null, [
          el('div.stat-n', null, [ String(stats.total), el('span.stat-u', { text:'条' }) ]),
          el('div.stat-l', { text:'近 30 天' })
        ]),
        el('div.stat', null, [
          el('div.stat-n', null, [ String(stats.streak), el('span.stat-u', { text:'天' }) ]),
          el('div.stat-l', { text:'连续记录' })
        ]),
        el('div.stat', null, [
          el('div.stat-n', null, [ String(stats.all), el('span.stat-u', { text:'条' }) ]),
          el('div.stat-l', { text:'一共封存' })
        ]),
        el('div.stat', null, [
          el('div.stat-n', { text: moodTop ? S.moodOf(moodTop[0]).name : '—' }),
          el('div.stat-l', { text:'最常出现' })
        ])
      ]));

      /* ---- 曲线 ---- */
      const days = series(30);
      days.forEach(d => { d.n = (stats.byDay[d.key] || []).length; });
      const max = Math.max(1, ...days.map(d => d.n));
      const pts = days.map((d, i) => [
        (i / (days.length - 1)) * W,
        H - PAD - (d.n / max) * (H - PAD * 2)
      ]);
      const line = smoothPath(pts);
      const area = line + 'L' + W + ' ' + H + 'L0 ' + H + 'Z';

      /* 这里用 innerHTML 拼的是自己生成的数字和常量，没有一处用户输入 ——
         用户写的心事只在下面用 textContent 渲染。 */
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', '近 30 天每天的记录条数');
      svg.innerHTML =
        '<defs><linearGradient id="ufill" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="rgba(255,233,168,.42)"/>' +
          '<stop offset="100%" stop-color="rgba(255,233,168,0)"/>' +
        '</linearGradient></defs>' +
        '<line x1="0" y1="' + (H - PAD) + '" x2="' + W + '" y2="' + (H - PAD) + '" ' +
              'stroke="var(--hair)" stroke-width="1"/>' +
        '<path d="' + area + '" fill="url(#ufill)"/>' +
        '<path d="' + line + '" fill="none" stroke="var(--ink)" stroke-width="1.4" ' +
              'stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>';

      /* 数据点只点在真有记录的日子上。空白日留白本身就是信息 ——
         那天没说话，不需要被补成一条平滑的线。 */
      days.forEach((d, i) => {
        if(!d.n) return;
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', pts[i][0]);
        c.setAttribute('cy', pts[i][1]);
        c.setAttribute('r', 2.6);
        c.setAttribute('fill', 'var(--glow)');
        c.setAttribute('stroke', 'var(--ink)');
        c.setAttribute('stroke-width', '1');
        svg.appendChild(c);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        t.textContent = d.key + ' · ' + d.n + ' 条';
        c.appendChild(t);
      });

      /* 一条数据都没有时不画图。全是 0 的曲线会渲染成贴底的一条直线，
         占着一大块空白，看起来像「渲染坏了」而不是「还没开始」。
         直接说话更清楚。 */
      if(stats.total === 0){
        root.appendChild(el('div.curve', null, [
          el('p.empty', { text:
            '还没有可以画的东西。\n' +
            '去「手账」写第一条，这里就会开始有东西长出来。' })
        ]));
      }else{
        root.appendChild(el('div.curve', null, [
          svg,
          el('div.curve-x', null, [
            el('span', { text: days[0].key.slice(5) }),
            el('span', { text:'每天记录条数' }),
            el('span', { text: days[days.length - 1].key.slice(5) })
          ])
        ]));
      }

      /* ---- 心情分布 ---- */
      const distBox = el('section.sec', null, [ el('h2.sec-h', { text:'这 30 天出现过的心情' }) ]);
      const total = stats.total || 1;
      const present = S.MOODS.filter(m => stats.moodCount[m.id]);
      if(!present.length){
        distBox.appendChild(el('p.empty', { text:'还没有记录。' }));
      }else{
        present.sort((a, b) => stats.moodCount[b.id] - stats.moodCount[a.id]).forEach(m => {
          const n = stats.moodCount[m.id];
          distBox.appendChild(el('div', { style:'margin-bottom:15px; max-width:420px' }, [
            el('div', { style:'display:flex; justify-content:space-between; fontSize:13px; margin-bottom:7px' }, [
              el('span', null, [
                el('span.mdot', { style:{ background:m.hex, marginRight:'8px' } }),
                m.name
              ]),
              el('span', { style:{ color:'var(--ink-3)' }, text: n + ' 次' })
            ]),
            el('div', { style:'background:var(--hair-2); border-radius:3px' }, [
              el('div', { style:{ height:'6px', borderRadius:'3px', background:m.hex,
                                  width: Math.max(3, (n / total) * 100) + '%', opacity:'.75' } })
            ])
          ]));
        });
      }
      root.appendChild(distBox);

      /* ---- 那时的你 ---- */
      const old = S.state.diary.filter(d => Date.now() - new Date(d.at).getTime() > 7 * 86400000);
      const thenBox = el('section.sec', null, [ el('h2.sec-h', { text:'那时的你' }) ]);
      if(!old.length){
        thenBox.appendChild(el('p.empty', { text:
          '还没有七天前的心事。\n攒得久一点再回来，这里会把当时写的东西翻给你看。' }));
      }else{
        old.slice(0, 3).forEach(d => {
          const m = S.moodOf(d.mood);
          thenBox.appendChild(el('div.card', { style:'margin-bottom:12px' }, [
            el('p', { style:'margin:0; fontSize:14.5px; lineHeight:1.85; whiteSpace:pre-wrap; wordBreak:break-word',
                      text:d.text }),
            el('p', { style:'margin:11px 0 0; fontSize:12px; color:var(--ink-3)',
                      text: fmtDate(d.at) + ' · ' + m.name })
          ]));
        });
      }
      root.appendChild(thenBox);
    }

    render();
    unsubs.push(S.on('diary', render));
  }

  function unmount(){
    unsubs.forEach(f => f());
    unsubs = [];
  }

  UFeel.pages.review = {
    eyebrow: '回顾',
    title: '这些天',
    note: '这里不给你打情绪分。看到的是你说了多少次，不是你有多少天是「好」的 —— 情绪没有好坏，只有说出来和没说出来的区别。',
    mount, unmount
  };
})();
</script>
<script>
/* ============================================================================
   板块 · 手账（心事储存罐）
   ----------------------------------------------------------------------------
   把一件心事写下来、封进罐子。罐子里的光点就是攒下来的条数 ——
   「看得见自己攒了多少」是这个板块唯一想给的反馈，没有打卡、没有连续天数压力。

   隐私立场落在两个地方：
     · 每条心事各自有一个「让它记住」开关，默认关（store 里 remember:false）。
       开启才炼成长期记忆，关掉时对应记忆一并撤除，不做「关了还记着」的事。
     · 罐子的内容只存在本机。导出和删除都在设置页，路径写清楚。
   ========================================================================== */
(function(){
  'use strict';

  const { el, clear, toast, fmtDate } = UFeel;

  const MAX_BEAD = 60;             // 罐子最多显示这么多光点，再多改用文字计数

  let unsubs = [];

  function mount(root, ctx){
    const S = UFeel.store;

    /* ---- 罐子 ---- */
    const jarBody = el('div.jar-body');
    const jarCap  = el('div.jar-cap');
    const jar = el('div.jar', null, [
      el('div.jar-mouth'),
      jarBody,
      jarCap
    ]);

    function renderJar(){
      clear(jarBody);
      const list = S.state.diary;
      list.slice(0, MAX_BEAD).forEach((d, i) => {
        const m = S.moodOf(d.mood);
        const bead = el('span.bead');
        bead.style.animationDelay = Math.min(i * 18, 500) + 'ms';
        bead.style.background = m.hex;
        bead.title = m.name + ' · ' + fmtDate(d.at);
        jarBody.appendChild(bead);
      });
      jarCap.textContent = list.length
        ? '已封存 ' + list.length + ' 件' + (list.length > MAX_BEAD ? '（点显示前 ' + MAX_BEAD + ' 件）' : '')
        : '还是空的';
    }

    /* ---- 列表 ---- */
    const list = el('div.dlist');

    function item(d){
      const m = S.moodOf(d.mood);
      const acts = el('div.ditem-acts', null, [
        el('button.linkish', {
          text: d.remember ? '已让它记住' : '让它记住',
          on:{ click: () => {
            S.setDiaryRemember(d.id, !d.remember);
            toast(d.remember ? '已从记忆里撤掉这条' : '已记到「记忆」');
          }}
        }),
        el('button.linkish', { text:'删掉', on:{ click: () => {
          if(confirm('这条删掉就找不回来了。确定吗？')){ S.removeDiary(d.id); toast('已删除'); }
        }}})
      ]);

      return el('div.ditem', null, [
        el('div.ditem-l', null, [
          el('span.mdot', { style:{ background:m.hex }, title:m.name }),
          el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }, text:'·'.repeat(d.intensity) })
        ]),
        el('div.ditem-b', null, [
          el('p.ditem-t', { text:d.text }),
          el('p.ditem-m', null, [
            el('span', { text: fmtDate(d.at) + ' ' + m.name }),
            d.remember ? el('span', { text:'· 已进入长期记忆' }) : null
          ]),
          acts
        ])
      ]);
    }

    function renderList(){
      clear(list);
      const arr = S.state.diary;
      if(!arr.length){
        list.appendChild(el('p.empty', { text:
          '还没有封存过什么。\n' +
          '想到什么就写什么，不必是一件大事 —— 那些没人听见的小事，往往才是压得最久的。' }));
        return;
      }
      arr.forEach(d => list.appendChild(item(d)));
    }

    /* ---- 写一条 ---- */
    const ta = el('textarea.ta', { rows:'5', placeholder:'今天有什么事堵在心里？写给自己看就行，不用讲道理。' });
    const counter = el('span.counter');

    const moodChips = el('div.chips');
    let pickedMood = 'unclear';
    let pickedIntensity = 3;

    function renderMoods(){
      clear(moodChips);
      S.MOODS.forEach(m => {
        moodChips.appendChild(el('button.chip' + (m.id === pickedMood ? '.on' : ''), {
          type:'button',
          on:{ click: () => { pickedMood = m.id; renderMoods(); } }
        }, [
          el('span.mdot', { style:{ background:m.hex } }),
          el('span', { text:m.name })
        ]));
      });
    }

    /* 强度用 1-5 的点，默认 3。刻意不给「很严重 / 轻微」这类判断性词。 */
    const intChips = el('div.chips');
    function renderIntensity(){
      clear(intChips);
      for(let i = 1; i <= 5; i++){
        intChips.appendChild(el('button.chip' + (i === pickedIntensity ? '.on' : ''), {
          type:'button', text: '·'.repeat(i),
          title: i + ' / 5',
          on:{ click: () => { pickedIntensity = i; renderIntensity(); } }
        }));
      }
    }

    let remember = false;
    const remSw = el('button.sw' + (remember ? '.on' : ''), {
      type:'button', 'aria-label':'让它记住',
      on:{ click: () => {
        remember = !remember;
        remSw.classList.toggle('on', remember);
        remHint.textContent = remember
          ? '这条会进入「记忆」，之后聊天时它可能会提到。随时可以在记忆页删掉。'
          : '默认不记。打开之后它才会进入「记忆」。';
      }}
    });
    const remHint = el('p.row-d', { text:'默认不记。打开之后它才会进入「记忆」。' });

    const saveBtn = el('button.btn.primary', { text:'封存进罐子' });

    function syncCounter(){
      const n = ta.value.length;
      counter.textContent = n ? n + ' 字' : '';
      counter.classList.toggle('over', n > 3000);
    }

    function save(){
      const text = ta.value.trim();
      if(!text){ toast('还没写什么'); ta.focus(); return; }
      S.addDiary({ text, mood:pickedMood, intensity:pickedIntensity, remember });
      ta.value = ''; syncCounter();
      remember = false; remSw.classList.remove('on');
      remHint.textContent = '默认不记。打开之后它才会进入「记忆」。';
      pickedMood = 'unclear'; pickedIntensity = 3;
      renderMoods(); renderIntensity();
      toast('已封存');
      renderJar();
    }
    saveBtn.addEventListener('click', save);

    ta.addEventListener('input', syncCounter);

    /* ---- 组装 ---- */
    root.appendChild(el('div.jar-wrap', null, [
      jar,
      el('div.dlist', null, [
        el('h2.sec-h', { text:'心事' }),
        list
      ])
    ]));

    root.appendChild(el('section.sec', { style:'margin-top:52px' }, [
      el('h2.sec-h', { text:'写一条新的' }),
      el('label.field', null, [ ta, counter ]),
      el('label.field', null, [
        el('span.field-l', { text:'这是什么感觉' }),
        moodChips
      ]),
      el('label.field', null, [
        el('span.field-l', { text:'有多重' }),
        intChips
      ]),
      el('div.row', null, [
        el('div.row-l', null, [
          el('div.row-t', { text:'让它记住这条' }),
          remHint
        ]),
        el('div.row-r', null, remSw)
      ]),
      el('div.row-acts', null, [ saveBtn ])
    ]));

    renderMoods();
    renderIntensity();
    renderJar();
    renderList();
    syncCounter();

    unsubs.push(S.on('diary', () => { renderJar(); renderList(); }));
  }

  function unmount(){
    unsubs.forEach(f => f());
    unsubs = [];
  }

  UFeel.pages.diary = {
    eyebrow: '手账',
    title: '心事储存罐',
    note: '写下来，封进罐子。罐子里每一点光是一件被你说出口过的心事。默认不会进入 AI 的记忆 —— 想让它记住哪条，你自己开。',
    mount, unmount
  };
})();
</script>
<script>
/* ============================================================================
   板块 · 微课
   ----------------------------------------------------------------------------
   每课两件事：一个概念 + 一个当场能做的练习。
   不要「5 个方法让你情绪稳定」那种承诺 —— 这个产品不承诺治愈。

   写法上的自我约束：
     · 不说「你应该」「你要学会」，只描述「可以有这么一种做法」。
     · 不把任何情绪定性成需要被修正的问题。
     · 每课结尾都留了「这课对你没用」的余地，避免变成另一种说教。
   ========================================================================== */
(function(){
  'use strict';

  const { el, clear, toast } = UFeel;

  const LESSONS = [
    {
      id:'name-it',
      title:'先给情绪起个名字',
      mins:4,
      body:[
        '心里堵的时候，很多人第一反应是「我没事」。但「没事」不是一个情绪，它是一个结论 —— 而且是下得有点早的结论。',
        '心理学里有个反复被验证的现象：当你能准确叫出一个情绪的名字时，它的强度通常会降下来一点。不是因为它消失了，而是因为它从一团模糊的压迫感，变成了一个可以被看着的东西。',
        '难的地方在于，情绪往往不是单一的。可能同时有委屈、有生气、还有一点「我是不是太矫情了」的自我怀疑。这些可以同时存在，不需要挑一个「主要的」。'
      ],
      ex:'写下今天最堵的那一刻，然后尽可能多地列出当时的感觉词，先不管准不准。\n列完之后，看看有没有哪个词让你「对，就是这个」。'
    },
    {
      id:'say-it',
      title:'说出口和说不出口，差在哪里',
      mins:5,
      body:[
        '「说不出口」很少是因为不会说话。更常见的原因是：以前说过，但接住的人不对。',
        '对方说「这有什么大不了的」「你想太多了」，于是你学到一件事 —— 说出来会得到否定，那还不如不说。这个学习过程完全是合理的，不是你太脆弱。',
        '所以问题往往不在于「你表达能力不够」，而在于你还没找到一个安全的说法，或者一个安全的人。这两件事里，只有第一件是你自己能控的。'
      ],
      ex:'拿一件你一直没说的话，试着把它改写成这个句式：\n「发生的是……，我感觉到……，我希望的是……」\n先写给自己看，不发给任何人。'
    },
    {
      id:'when-dismissed',
      title:'当别人说「你想多了」',
      mins:4,
      body:[
        '这句话之所以伤人，是因为它否定的不是你的判断，而是你的感受本身 —— 好像你的感觉是算错题。',
        '但感受不是判断，没有对错。你确实感觉到了，这件事已经发生了，不需要谁来批准。',
        '你不需要说服对方承认你的感受是合理的。你可以只是知道：他接不住，不代表我说错了。这两件事是分开的。'
      ],
      ex:'回想一次被否定的经历，在心里把下面这句补完整：\n「当时他说……，我其实想说的是……，而我现在知道，我的感觉不需要他同意。」'
    },
    {
      id:'self-kind',
      title:'对自己好一点，不是纵容',
      mins:5,
      body:[
        '很多人对自己说话的方式，是不会对任何朋友说的。朋友搞砸了，你说「这事挺难的」；自己搞砸了，你说「你怎么这么没用」。',
        '有人担心：对自己温和，是不是就会放松要求、越来越差？现有研究不太支持这个担心 —— 自我批评带来的更多是回避和拖延，而不是改变。因为被骂的时候，人第一反应是保护自己，不是改进。',
        '自我关怀不等于「我做什么都对」。它更像是：承认这件事没做好，同时不把这件事等同于「我是个不好的人」。'
      ],
      ex:'想一件最近让你自责的事。然后试着用「对一个刚认识的朋友」的语气，把这件事重新说一遍给自己听。\n注意一下，两个版本的身体感觉有没有不一样。'
    },
    {
      id:'boundary',
      title:'边界不是冷漠',
      mins:4,
      body:[
        '拒绝别人时的那种愧疚感，往往来自一个默认前提：我的价值在于「对别人有用」。',
        '但边界的作用不是把人推开，而是让你能长久地待在关系里。一直撑到耗竭，然后突然消失，对关系的伤害其实更大。',
        '一句「我现在没有力气接这个」，是在描述你的状态，不是在评价对方的要求。这两件事可以同时成立。'
      ],
      ex:'找出最近一件你其实不想答应、但还是答应了的事。\n试着写一句拒绝的话，不用发出去 —— 先练习「这句话可以说出口」这件事本身。'
    },
    {
      id:'burnout',
      title:'耗竭不是懒',
      mins:5,
      body:[
        '长期耗竭的样子，经常不是「什么都不想干」，而是「什么都干了，但一点感觉都没有」。麻木、易怒、对以前喜欢的事失去兴趣，都可能是它。',
        '它和懒惰的区别在于：懒的人休息完会好，耗竭的人休息完还是空的。',
        '如果你已经很久都处在这个状态里，那不是靠「调整心态」能过去的。这时候需要的是外部支持 —— 值得信任的人，或者一个专业的人。这跟感冒了要去医院是一样的性质，不是「你不够坚强」。'
      ],
      ex:'回忆一下上一次你觉得「稍微缓过来一点」是什么时候、在做什么。\n把它写下来。不是为了让你马上去做，只是为了确认：那件事是存在的。'
    }
  ];

  let unsubs = [];

  function mount(root, ctx){
    const S = UFeel.store;
    const box = el('div.lessons');
    const open = {};                 // id -> 是否展开

    function render(){
      clear(box);
      LESSONS.forEach((L, i) => {
        const isOpen = !!open[L.id];
        const done = S.state.course.done.indexOf(L.id) >= 0;

        const item = el('section.lesson' + (isOpen ? '.open' : ''));

        const head = el('button.lesson-h', { type:'button', 'aria-expanded': isOpen ? 'true' : 'false' }, [
          el('span.lesson-n', { text: String(i + 1).padStart(2, '0') }),
          el('span.lesson-t', { text: L.title }),
          el('span.lesson-m', { text: done ? '已读过' : L.mins + ' 分钟' })
        ]);
        head.addEventListener('click', () => {
          open[L.id] = !open[L.id];
          render();
        });

        const inner = el('div.lesson-b');
        L.body.forEach(p => inner.appendChild(el('p', { text:p })));
        inner.appendChild(el('div.ex', null, [
          el('div.ex-l', { text:'试一下' }),
          el('p', { text:L.ex })
        ]));

        /* 标记「读过」而不是「完成」。不设进度条、不给完成度百分比 ——
           这类内容被当成任务打卡，就变成又一个压力源了。 */
        inner.appendChild(el('div.row-acts', null, [
          el('button.linkish', {
            text: done ? '取消标记' : '这一课我读过了',
            on:{ click: () => {
              const arr = S.state.course.done;
              const at = arr.indexOf(L.id);
              if(at >= 0) arr.splice(at, 1);
              else { arr.push(L.id); toast('记下了'); }
              S.save('course'); render();
            }}
          }),
          el('button.linkish', {
            text:'这课对我没什么用',
            on:{ click: () => toast('知道了，那就不看它') }
          })
        ]));

        item.appendChild(head);
        item.appendChild(el('div.lesson-c', null, el('div', null, inner)));
        box.appendChild(item);
      });
    }

    /* 顶部的说明：把「这里不治病」这件事讲在开头 */
    root.appendChild(el('div.card', { style:'max-width:760px; margin-bottom:34px' }, [
      el('p', { style:'margin:0; fontSize:14px; lineHeight:1.9; color:var(--ink-2)', text:
        '这些课不治愈任何东西，也不打算让你「变得更好」。它们只是一些被反复讲过的、' +
        '可能有用的小角度。有用就拿着，没用就跳过 —— 你不是来交作业的。' })
    ]));

    root.appendChild(box);
    render();

    unsubs.push(S.on('course', render));
  }

  function unmount(){
    unsubs.forEach(f => f());
    unsubs = [];
  }

  UFeel.pages.course = {
    eyebrow: '微课',
    title: '五分钟，一个小角度',
    note: '每课只有一个概念和一个能当场做的练习。不考试、不打卡、不统计完成度 —— 读了几课是你的私事。',
    mount, unmount
  };
})();
</script>
<script>
/* ============================================================================
   板块 · 找人聊
   ----------------------------------------------------------------------------
   产品里最核心的一块：把「说不出口」的话接住。

   三条贯穿整个交互的立场（来自产品底线原则，不是装饰性文案）：
     1. 基础的单窗口陪伴完整、不打折。深度模式是「多几个视角」，
        不是「付费才好好听你说话」。所以深度模式按钮置灰时，
        旁边必须写清「现在这个仍然完整可用」，而不是让用户以为自己被降级了。
     2. 发送前先过脱敏闸门。原文一旦发出去再提示就晚了。
     3. 对面是 AI 这件事，一开始就说清楚，不等用户问。
   ========================================================================== */
(function(){
  'use strict';

  const { el, clear, toast } = UFeel;

  /* 风险提示里给的是国内可用的公开热线。
     12356 是国家心理健康服务热线，24 小时。 */
  const CRISIS_TEXT =
    '你刚才写的东西让我有点担心你。\n' +
    '我不确定你现在是否安全，但我没法像真人那样陪在你身边，' +
    '也没法在你出事的时候赶到你那里 —— 这是我作为 AI 最真实的局限。\n' +
    '如果此刻你有伤害自己的念头，请打 12356（全国心理援助热线，24 小时）。' +
    '如果危险就在眼前，打 120 或 110。\n' +
    '你也可以继续跟我说，我会在这儿。但请把电话也打出去。';

  const DEEP_COST = 3;             // 深度模式消耗的积分

  let unsubs = [];                 // 订阅句柄，unmount 时统一撤掉
  let busy = false;
  let ctrl = null;                 // 当前请求的 AbortController

  function mount(root, ctx){
    const S = UFeel.store;
    const api = UFeel.api;

    const thread  = el('div.chat');
    const ta      = el('textarea.ta', { rows:'3', placeholder:'想说什么都可以。说不清也可以，不用先整理好。' });
    const counter = el('span.counter');
    const sendBtn = el('button.btn.send.primary', { text:'说出去' });
    const note    = el('span.composer-note');

    /* ---- 一条消息 ---- */
    function bubble(m){
      if(m.role === 'sys'){
        return el('div.bub.sys' + (m.warn ? '.warn' : ''), null,
          el('p.bub-t', { text: m.text }));
      }
      const wrap = el('div.bub' + (m.role === 'me' ? '.me' : '.ai'));
      wrap.appendChild(el('div.bub-who', { text: m.role === 'me' ? '你' : '倾听者' }));
      const t = el('p.bub-t', { text: m.text });
      wrap.appendChild(t);

      /* 自己说的话旁边挂一个「记到记忆」——
         什么时候被记住由用户自己决定，AI 不偷偷记。 */
      if(m.role === 'me' && m.text && m.text.length > 6){
        const acts = el('div.ditem-acts', null,
          el('button.linkish', { text:'让它记住', on:{ click: () => {
            S.addMemory({ layer:'ongoing', text:m.text, source:'talk', sourceId:m.id });
            toast('已记到「记忆」，随时可以删');
          }}})
        );
        wrap.appendChild(acts);
      }
      return wrap;
    }

    function renderAll(){
      clear(thread);
      if(!S.state.chat.length){
        thread.appendChild(el('div.bub.ai', null, [
          el('div.bub-who', { text:'倾听者' }),
          el('p.bub-t', { text:
            '我在。\n' +
            '你可以从今天发生的一件小事讲起，也可以直接讲那件压了很久的事。\n' +
            '不用开头，不用交代背景，想到哪儿说到哪儿。' })
        ]));
      }
      S.state.chat.forEach(m => thread.appendChild(bubble(m)));
      scrollEnd();
    }

    const scrollEnd = () => { root.scrollTop = root.scrollHeight; };

    /* ---- 发送 ---- */
    function syncCounter(){
      const n = ta.value.length;
      counter.textContent = n ? n + ' 字' : '';
      counter.classList.toggle('over', n > 2000);
    }

    async function send(){
      const text = ta.value.trim();
      if(!text || busy) return;

      /* 闸门在发送之前。命中敏感信息就地拦下，原文不离开浏览器。 */
      const sc = await api.scan(text);
      if(sc.blocked){
        S.addChat({ role:'sys', text:
          sc.note + '\n这类信息一旦发出去就收不回来了，我这边也存不住它。' +
          '把号码、证件号、地址换成别的说法再发一次吧 —— 事情本身你可以照讲。' });
        renderAll();
        return;
      }

      S.addChat({ role:'me', text });
      ta.value = ''; syncCounter();
      renderAll();

      /* 本轮的风险等级后端会随流回传；本地模式由 scan 给出。 */
      let level = sc.level;
      busy = true;
      sendBtn.disabled = true;
      note.textContent = '正在回应…';

      const aiWrap = el('div.bub.ai', null, [
        el('div.bub-who', { text:'倾听者' }),
        el('p.bub-t', null, el('span.caret'))
      ]);
      thread.appendChild(aiWrap);
      scrollEnd();

      const p = aiWrap.querySelector('.bub-t');
      const caret = p.querySelector('.caret');
      let acc = '';
      const put = t => { acc += t; p.textContent = acc; p.appendChild(caret); scrollEnd(); };

      ctrl = new AbortController();
      let wasLocal = false;
      try{
        const r = await api.chat(
          S.state.chat.filter(m => m.role !== 'sys')
            .map(m => ({ role: m.role === 'me' ? 'user' : 'assistant', content: m.text })),
          { onToken: put,
            onMeta: meta => { if(meta.level && meta.level !== 'none') level = meta.level;
                              if(meta.local) wasLocal = true; },
            signal: ctrl.signal }
        );
        wasLocal = r && r.local;
      }catch(e){
        console.error(e);
        if(!acc) put('刚才那句没送出去。再试一次，或者先歇会儿也行。');
      }

      caret.remove();
      if(acc) S.addChat({ role:'ai', text: acc });
      if(wasLocal) note.textContent = '本地演示模式（未连接后端）';
      else note.textContent = '';

      /* 高风险：单独追加一条系统提示。它不伪装成 AI 的共情话术，
         因为这时候需要的是一串能拨出去的电话，不是一段安慰。 */
      if(level === 'high' && S.state.settings.crisisSupport){
        S.addChat({ role:'sys', warn:true, text: CRISIS_TEXT });
        renderAll();
      }

      busy = false;
      sendBtn.disabled = false;
      if(!wasLocal) note.textContent = '';
      ta.focus();
    }

    /* ---- 深度模式：多视角并行 ---- */
    const deepBtn = el('button.btn', { text:'换个角度看看（深度模式）' });
    const deepNote = el('p.field-hint');
    function syncDeep(){
      const bal = S.state.credits.balance;
      const ok = bal >= DEEP_COST;
      deepBtn.disabled = !ok;
      deepNote.textContent = ok
        ? '会让几个不同的角度各看一遍你刚才说的事，消耗 ' + DEEP_COST + ' 积分（当前 ' + bal + '）。' +
          '这只是多几个视角，上面的一对一陪伴不受影响。'
        : '深度模式需要 ' + DEEP_COST + ' 积分，你现在有 ' + bal + ' 个。\n' +
          '『说出去』照常能用，而且和以前完全一样 —— 积分少的只是视角的数量，不是被对待的方式。';
    }

    const views = el('div.views');
    async function runDeep(){
      const msgs = S.state.chat.filter(m => m.role !== 'sys')
        .map(m => ({ role: m.role === 'me' ? 'user' : 'assistant', content: m.text }));
      if(!msgs.length){ toast('先说一句话吧'); return; }
      if(!S.spend(DEEP_COST, '深度模式 · 多视角')){ toast('积分不够，基础陪伴不受影响'); return; }

      deepBtn.disabled = true;
      deepNote.textContent = '正在让几个模型分别看一遍…';
      clear(views);
      try{
        const r = await UFeel.api.panorama(msgs);
        r.views.forEach(v => views.appendChild(
          el('div.view', null, [
            el('div.view-n', { text:v.name }),
            el('p.view-t', { text:v.text })
          ])
        ));
        deepNote.textContent = '以上是几个不同角度的看法，不一定都对，挑你觉得有用的拿走。';
      }catch(e){
        console.error(e);
        deepNote.textContent = '这次没取到多视角的回复，积分已经退回。';
        S.earn(DEEP_COST, '深度模式失败退回');
      }
      syncDeep();
    }
    deepBtn.addEventListener('click', runDeep);

    /* ---- 组装 ---- */
    const composer = el('div.composer', null, [
      el('label.field', null, [ ta, counter ]),
      el('div.composer-foot', null, [
        el('div', null, [ note ]),
        sendBtn
      ])
    ]);

    const deep = el('div', null, [
      el('p.deep-h', { text:'深度模式' }),
      el('div.row-acts', null, [ deepBtn ]),
      deepNote,
      views
    ]);

    const clearBtn = el('button.linkish', { text:'清空这次对话', on:{ click: () => {
      if(confirm('清空后这些对话就不在了。确定吗？')){ S.clearChat(); renderAll(); }
    }}});

    appendAll();
    function appendAll(){
      root.appendChild(thread);
      root.appendChild(composer);
      root.appendChild(el('div', { style:'margin-top:44px' }, deep));
      root.appendChild(el('div', { style:'margin-top:30px' }, clearBtn));
    }

    /* 本地演示模式：如实标注，不让人以为对面是真模型 */
    if(api.isLocal()){
      note.textContent = '本地演示模式（未连接后端）';
    }

    renderAll();
    syncCounter();
    syncDeep();

    ta.addEventListener('input', syncCounter);
    ta.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener('click', send);

    unsubs.push(S.on('credits', syncDeep));
    ta.focus();

    /* 探活是异步的，回来之后要把提示补上 */
    UFeel.api.probe().then(ok => {
      if(!ok && !busy) note.textContent = '本地演示模式（未连接后端）';
    });
  }

  function unmount(){
    unsubs.forEach(f => f());
    unsubs = [];
    if(ctrl){ ctrl.abort(); ctrl = null; }
    busy = false;
  }

  UFeel.pages.talk = {
    eyebrow: '找人聊',
    title: '先说说话吧',
    note: '对面是 AI，不是真人 —— 我不会累，不会评判你，也不会把你说的话转述给任何人。但我同样代替不了身边的人，这一点我不想含糊过去。想说什么都可以，说不清也可以。',
    mount, unmount
  };
})();
</script>
<script>
/* ============================================================================
   板块 · 记忆
   ----------------------------------------------------------------------------
   「AI 到底记住了我什么」必须是用户随时能看见、能改、能删的。
   这一页是隐私四重保障里「分层」和「申诉机制」的落地处：

     分层      —— 记忆按 关于我 / 重要的人 / 正在经历 / 偏好 分开摆，
                  用户看得见 AI 把自己按哪个维度归档了。
     默认不记  —— 总开关关掉后，新内容不再进记忆（旧记忆保留，由用户自己决定去留）。
     申诉机制  —— 不是所有伤害都能靠「删掉这条」解决，所以单独留了入口。

   总开关和逐条删除是两件事，文案里必须说清，否则用户会以为关掉开关等于清空。
   ========================================================================== */
(function(){
  'use strict';

  const { el, clear, toast, fmtDate, fmtRel } = UFeel;

  let unsubs = [];

  function mount(root, ctx){
    const S = UFeel.store;

    /* ---- 总开关 ---- */
    const masterSw = el('button.sw' + (S.state.settings.privacy.longTermMemory ? '.on' : ''), {
      type:'button', 'aria-label':'长期记忆总开关',
      on:{ click: () => {
        const on = !S.state.settings.privacy.longTermMemory;
        S.setSetting('privacy.longTermMemory', on);
        masterSw.classList.toggle('on', on);
        masterHint.textContent = on
          ? '打开时，你明确让它记住的内容会进入长期记忆。'
          : '已关闭。新的内容不会再进入记忆 —— 但已有的记忆还在下面，需要你自己删。';
        toast(on ? '长期记忆已打开' : '长期记忆已关闭，已有记忆未删除');
      }}
    });
    const masterHint = el('p.row-d', { text: S.state.settings.privacy.longTermMemory
      ? '打开时，你明确让它记住的内容会进入长期记忆。'
      : '已关闭。新的内容不会再进入记忆 —— 但已有的记忆还在下面，需要你自己删。' });

    /* ---- 手动加一条 ---- */
    const addTa = el('textarea.ta', { rows:'3', placeholder:'有什么想让它一直记得的？比如「我容易在晚上情绪低」「我妈叫小梅，我们关系紧张」。' });
    const addLayer = el('div.chips');
    let newLayer = 'about';
    function renderAddLayer(){
      clear(addLayer);
      S.LAYERS.forEach(l => {
        addLayer.appendChild(el('button.chip' + (l.id === newLayer ? '.on' : ''), {
          type:'button', text:l.name,
          on:{ click: () => { newLayer = l.id; renderAddLayer(); } }
        }));
      });
    }
    const addBtn = el('button.btn.primary', { text:'记下来' });
    addBtn.addEventListener('click', () => {
      const text = addTa.value.trim();
      if(!text){ toast('还没写什么'); return; }
      S.addMemory({ layer:newLayer, text, source:'manual' });
      addTa.value = '';
      toast('已记下');
    });

    /* ---- 分组 ---- */
    const groups = el('div');
    const editing = {};              // id -> 是否处于编辑态

    function renderGroups(){
      clear(groups);
      const all = S.state.memory;

      if(!all.length){
        groups.appendChild(el('p.empty', { text:
          '记忆还是空的。\n' +
          '只有你明确让它记住的内容才会出现在这里 —— 手账默认不进记忆，' +
          '对话也要你点「让它记住」才会留下。' }));
        return;
      }

      S.LAYERS.forEach(layer => {
        const items = all.filter(m => m.layer === layer.id);
        if(!items.length) return;

        const box = el('section.mem-group', null, [
          el('h2.sec-h', { text: layer.name + ' · ' + items.length + ' 条' })
        ]);

        items.forEach(m => {
          const body = el('div.mem-item');
          if(editing[m.id]){
            const ta = el('textarea.ta', { rows:'3' });
            ta.value = m.text;
            body.appendChild(ta);
            body.appendChild(el('div.mem-acts', null, [
              el('button.linkish', { text:'保存', on:{ click: () => {
                const t = ta.value.trim();
                if(!t){ toast('不能留空'); return; }
                S.updateMemory(m.id, t);
                delete editing[m.id];
                toast('已更新');
              }}}),
              el('button.linkish', { text:'取消', on:{ click: () => {
                delete editing[m.id];
                renderGroups();
              }}})
            ]));
          }else{
            body.appendChild(el('p.mem-t', { text:m.text }));
            body.appendChild(el('p.mem-m', { text:
              fmtDate(m.at) + ' · ' + (m.source === 'manual' ? '你手动加的'
                : m.source === 'diary' ? '来自手账' : '来自对话') +
              (m.edited ? ' · 你改过' : '') }));
            body.appendChild(el('div.mem-acts', null, [
              el('button.linkish', { text:'改', on:{ click: () => { editing[m.id] = true; renderGroups(); } }}),
              el('button.linkish', { text:'删掉', on:{ click: () => {
                if(confirm('删掉之后，AI 就不再记得这条了。确定吗？')){
                  S.removeMemory(m.id);
                  toast('已删除');
                }
              }}}),
              el('button.linkish', { text:'改分层', on:{ click: () => {
                const i = S.LAYERS.findIndex(l => l.id === m.layer);
                m.layer = S.LAYERS[(i + 1) % S.LAYERS.length].id;
                S.save('memory'); S.emit('memory', S.state.memory);
              }}})
            ]));
          }
          box.appendChild(body);
        });

        groups.appendChild(box);
      });
    }

    /* ---- 申诉 ---- */
    const apTa = el('textarea.ta', { rows:'3', placeholder:'这条记忆哪里不对？是不准确的、不该被记的，还是让你不舒服的？' });
    const apBtn = el('button.btn', { text:'提交申诉' });
    apBtn.addEventListener('click', async () => {
      const text = apTa.value.trim();
      if(!text){ toast('先写一下是什么问题'); return; }

      /* 后端没连上时不假装提交成功 —— 申诉最不能做的事，
         就是让人以为「已经有人知道了」。 */
      apBtn.disabled = true;
      const r = await UFeel.api.appeal(text);
      apBtn.disabled = false;

      if(!r){
        toast('当前未连接后端，申诉没有发出去');
        apNote.textContent =
          '这份申诉没有送出去 —— 后端没连上。\n' +
          '你可以先直接用上面的「删掉」把问题记忆清掉；需要人工介入的话，' +
          '走设置页里的客服通道（20:00–06:00 有人值守）。';
        return;
      }
      apTa.value = '';
      apNote.textContent = '已受理，编号 ' + r.id + '。' + r.message;
      toast('申诉已提交');
    });
    const apNote = el('p.appeal-d');

    /* ---- 组装 ---- */
    root.appendChild(el('section.sec', null, [
      el('h2.sec-h', { text:'长期记忆' }),
      el('div.row', null, [
        el('div.row-l', null, [
          el('div.row-t', { text:'允许长期记忆' }),
          masterHint
        ]),
        el('div.row-r', null, masterSw)
      ])
    ]));

    root.appendChild(groups);

    root.appendChild(el('section.sec', { style:'margin-top:48px' }, [
      el('h2.sec-h', { text:'手动加一条' }),
      el('label.field', null, [ addTa ]),
      el('label.field', null, [
        el('span.field-l', { text:'归到哪一类' }),
        addLayer
      ]),
      el('div.row-acts', null, [ addBtn ])
    ]));

    root.appendChild(el('div.appeal', null, [
      el('p.appeal-t', { text:'对某条记忆有异议？' }),
      el('p.appeal-d', { text:
        '记忆是模型从你说过的话里整理的，它可能记错、记偏，或者记下了你并不想被记住的东西。' +
        '直接用「删掉」是最快的；如果问题不在单条记忆上（比如你认为整个记忆机制对你不公平），' +
        '用下面这个入口提出来。' }),
      el('label.field', null, [ apTa ]),
      el('div.row-acts', null, [ apBtn ]),
      apNote
    ]));

    renderAddLayer();
    renderGroups();

    unsubs.push(S.on('memory', renderGroups));
  }

  function unmount(){
    unsubs.forEach(f => f());
    unsubs = [];
  }

  UFeel.pages.memory = {
    eyebrow: '记忆',
    title: '它记住了你什么',
    note: '这里是全部 —— 没有你看不见的隐藏记忆。不准确的可以改，不想被记的可以删，记错了可以申诉。默认不记，开启也只是让你明确授权的那些内容留下来。',
    mount, unmount
  };
})();
</script>
<script>
/* ============================================================================
   板块 · 设置
   ----------------------------------------------------------------------------
   这一页承担两件在别处不好说清的事：

   1. 积分规则的透明。退款条款不藏在二级页里，直接摊在账单下面。
      产品底线是「不能让用户觉得不付钱就得不到好好被对待」，
      那这条底线本身就应该是写在明面上的，而不是只在代码里成立。

   2. 夜间客服的分层。20:00–06:00 是情绪上涌期，这个时段客服通道要显眼；
      其余时段收起，避免变成又一个常驻广告位。
   ========================================================================== */
(function(){
  'use strict';

  const { el, clear, toast, fmtDate, fmtTime } = UFeel;

  const AGE_BANDS = [
    { id:'unset',   name:'不设置' },
    { id:'under18', name:'18 岁以下' },
    { id:'18-25',   name:'18–25' },
    { id:'over25',  name:'25 岁以上' }
  ];
  const MODELS = [
    { id:'auto',     name:'自动',      d:'按可用性和当前负载选，一般用这个。' },
    { id:'deepseek', name:'DeepSeek',  d:'中文语感更顺，回复偏快。' },
    { id:'gemini',   name:'Gemini',    d:'长文本理解更稳，回复稍慢。' }
  ];

  let unsubs = [];
  let bodyObs = null;

  /* 夜间时段：20:00 到次日 06:00 */
  const isNight = () => { const h = new Date().getHours(); return h >= 20 || h < 6; };

  function mount(root, ctx){
    const S = UFeel.store;
    const P = S.state.settings.privacy;

    /* ---------- 通用构件 ---------- */
    function row(title, desc, right){
      return el('div.row', null, [
        el('div.row-l', null, [
          el('div.row-t', { text:title }),
          desc ? el('p.row-d', { text:desc }) : null
        ]),
        el('div.row-r', null, right)
      ]);
    }
    function sw(on, onChange, label){
      const b = el('button.sw' + (on ? '.on' : ''), {
        type:'button', 'aria-label': label,
        on:{ click: () => { const v = !b.classList.contains('on'); b.classList.toggle('on', v); onChange(v); } }
      });
      return b;
    }

    /* ---------- 1. 使用 ---------- */
    const darkSw = sw(document.body.classList.contains('dark'), v => {
      /* 真正切主题的是 water.js 里 #btn 的 onclick（它还要清两套渲染的残留数据）。
         这里只是替用户点一下那个按钮，不重复实现一遍切换逻辑。 */
      document.getElementById('btn').click();
    }, '深色模式');

    /* 主题也可能被右上角那个按钮改掉，跟着同步，免得开关显示得跟实际不一致 */
    bodyObs = new MutationObserver(() => {
      darkSw.classList.toggle('on', document.body.classList.contains('dark'));
    });
    bodyObs.observe(document.body, { attributes:true, attributeFilter:['class'] });

    const ageChips = el('div.chips');
    function renderAge(){
      clear(ageChips);
      AGE_BANDS.forEach(b => {
        ageChips.appendChild(el('button.chip' + (S.state.settings.ageBand === b.id ? '.on' : ''), {
          type:'button', text:b.name,
          on:{ click: () => {
            S.setSetting('ageBand', b.id);
            /* 未满 18 岁不开放社区 —— 竞品里「未成年人沉迷」是真问题，
               这里直接不给入口，而不是靠事后提醒。 */
            if(b.id === 'under18' && S.state.settings.community){
              S.setSetting('community', false);
              toast('18 岁以下不开放社区，已为你关掉');
            }
            renderAge(); renderCommunity(); renderAgeNote();
          }}
        }));
      });
    }
    const ageNote = el('p.field-hint');
    function renderAgeNote(){
      const band = S.state.settings.ageBand;
      ageNote.textContent =
        band === 'under18'
          ? '未满 18 岁：不开放社区，广告与积分兑换也一并关闭。如果情绪长期困扰你，请让监护人或学校心理老师知道 —— 这不是小题大做。'
          : band === 'unset'
            ? '不设置也可以。设置年龄只影响能不能进社区、以及风险提示的方式，不影响其他任何功能。'
            : '年龄只用于功能分层和风险提示，不会用于推荐或广告。';
    }

    const modelChips = el('div.chips');
    function renderModel(){
      clear(modelChips);
      MODELS.forEach(m => {
        modelChips.appendChild(el('button.chip' + (S.state.settings.model === m.id ? '.on' : ''), {
          type:'button', text:m.name,
          on:{ click: () => { S.setSetting('model', m.id); renderModel(); renderModelNote(); } }
        }));
      });
    }
    const modelNote = el('p.field-hint');
    function renderModelNote(){
      const m = MODELS.find(x => x.id === S.state.settings.model) || MODELS[0];
      modelNote.textContent = m.d + '（两个都没配 Key 时自动走本地演示模式）';
    }

    const communitySw = sw(S.state.settings.community, v => {
      if(v && S.state.settings.ageBand === 'under18'){
        toast('18 岁以下不开放社区');
        communitySw.classList.remove('on');
        return;
      }
      S.setSetting('community', v);
      toast(v ? '社区已开启' : '社区已关闭');
    }, '社区');
    function renderCommunity(){ communitySw.classList.toggle('on', S.state.settings.community); }

    const rippleSw = sw(S.state.settings.ripples !== false, v => {
      S.setSetting('ripples', v);
      toast(v ? '涟漪已打开' : '涟漪已关闭');
    }, '涟漪效果');

    root.appendChild(el('section.sec', null, [
      el('h2.sec-h', { text:'使用' }),
      row('深色模式', '浅色是水面，深色是丝绸。两套是分别调的，不是换了个颜色。', darkSw),
      row('涟漪效果',
          '鼠标划过时荡开的涟漪。板块页里也有，但间距大得多 —— '
          + '面板上密密麻麻的涟漪不会变成活气，只会盖过正文。关掉后水面完全静止。',
          rippleSw),
      el('div', { style:'padding:17px 0; border-bottom:1px solid var(--hair-2)' }, [
        el('div.row-t', { text:'年龄段' }),
        el('div', { style:'margin:13px 0 10px' }, ageChips),
        ageNote
      ]),
      el('div', { style:'padding:17px 0; border-bottom:1px solid var(--hair-2)' }, [
        el('div.row-t', { text:'默认模型' }),
        el('div', { style:'margin:13px 0 10px' }, modelChips),
        modelNote
      ]),
      row('社区', '默认关闭。开启后是语音和照片为主的分享区，不做公开文字广场 —— 打字成本和肖像泄露风险都太高。', communitySw)
    ]));

    /* ---------- 2. 隐私 ---------- */
    root.appendChild(el('section.sec', null, [
      el('h2.sec-h', { text:'隐私' }),
      row('允许长期记忆', '关闭后新内容不再进入记忆。已有的记忆不会自动清掉，去「记忆」页自己删。',
        sw(P.longTermMemory, v => S.setSetting('privacy.longTermMemory', v), '长期记忆')),
      row('手账自动进入记忆', '默认关闭。开着的话，你写的每一条心事都会进记忆 —— 我们觉得这个默认值应该是关的。',
        sw(P.diaryToMemory, v => S.setSetting('privacy.diaryToMemory', v), '手账进记忆')),
      row('保留对话原文', '关闭后，对话只存在于当前这次浏览里，关掉页面就没了。',
        sw(P.keepTranscript, v => S.setSetting('privacy.keepTranscript', v), '保留对话')),
      el('div.card', { style:'margin-top:22px' }, [
        el('p', { style:'margin:0 0 10px; fontSize:14px; fontWeight:400', text:'我们不收这些东西' }),
        el('p', { style:'margin:0; fontSize:13px; lineHeight:1.9; color:var(--ink-2)', text:
          '身份证号、银行卡号、手机号、邮箱这类信息，在发出去之前就会被拦下来，' +
          '拦截在你自己浏览器里完成，原文不会离开这台设备。\n' +
          '姓名、学校、具体住址这些能指向你本人的信息，也不需要告诉我们。' +
          '说事情本身就够了 —— 谁、在哪儿，通常不影响你有没有被听懂。\n' +
          '例外是实名认证，那是为了防未成年人和防诈骗，只做一次，不做他用。' })
      ]),
      el('div.card', { style:'margin-top:12px' }, [
        el('p', { style:'margin:0 0 10px; fontSize:14px; fontWeight:400', text:'隐私的四层保障' }),
        el('p', { style:'margin:0; fontSize:13px; lineHeight:1.9; color:var(--ink-2)', text:
          '分层      —— 记忆按四个维度分开记，你能看见全部，没有隐藏记忆。\n' +
          '默认不记  —— 手账不进记忆、对话要你点了才记。默认值本身就是保护。\n' +
          '脱敏闸门  —— 敏感信息在发送前拦截，优先拦在本地。\n' +
          '申诉机制  —— 在「记忆」页，对记错、记偏的内容可以提出异议。' })
      ])
    ]));

    /* ---------- 3. 积分与账单 ---------- */
    const balBox = el('div.stat', { style:'max-width:220px' }, [
      el('div.stat-n', null, [ el('span', { text:String(S.state.credits.balance) }), el('span.stat-u', { text:'分' }) ]),
      el('div.stat-l', { text:'当前余额' })
    ]);
    const ledgerBox = el('div.ledger');

    function renderCredits(){
      clear(ledgerBox);
      const led = S.state.credits.ledger;
      if(!led.length){
        ledgerBox.appendChild(el('p.empty', { text:
          '还没有任何积分记录。\n积分只影响「深度模式」这种额外的视角数量 —— ' +
          '不充值也不影响一对一陪伴的完整度。' }));
        return;
      }
      led.slice(0, 30).forEach(it => {
        ledgerBox.appendChild(el('div.led-item', null, [
          el('span.led-d', { text: fmtDate(it.at) + ' ' + fmtTime(it.at) }),
          el('span.led-v', { text: it.reason }),
          el('span.led-n' + (it.delta > 0 ? '.pos' : '.neg'), {
            text: (it.delta > 0 ? '+' : '') + it.delta })
        ]));
      });
    }

    root.appendChild(el('section.sec', null, [
      el('h2.sec-h', { text:'积分与账单' }),
      balBox,
      el('div', { style:'margin-top:22px' }, ledgerBox),
      el('div.plan-note', null, [
        el('p', { style:'margin:0; fontSize:14px', text:'关于积分，把话说在前面' }),
        el('ol', null, [
          el('li', { text:'基础的单窗口陪伴永远完整、不打折。积分只决定要不要「多几个视角」，不决定有没有被好好听着。' }),
          el('li', { text:'积分不够时不会中断，也不会降级到让你觉得被冷落 —— 深度模式按钮置灰，一对一照旧。' }),
          el('li', { text:'签到、日常使用、提建议都能拿免费积分，不是只能充值。' }),
          el('li', { text:'退款只针对真金白银充值、且尚未消耗的那部分。签到和任务拿到的免费积分不退，已消耗的算力成本不退。' }),
          el('li', { text:'当月购买未用完的部分可以按比例退，会设一个最低门槛和少量手续费 —— 这一条是为了拦住月底充一点再用完就退的薅羊毛，不是为了多收你钱。' }),
          el('li', { text:'消耗和退款规则在使用指南里写全，不在暗处扣分。' })
        ]),
        el('div.row-acts', null, [
          el('button.btn', { text:'签到领积分', on:{ click: () => {
            const today = new Date().toISOString().slice(0, 10);
            const last = (S.state.credits.ledger.find(x => x.reason === '每日签到') || {}).at;
            if(last && last.slice(0, 10) === today){ toast('今天已经签过了'); return; }
            S.earn(2, '每日签到');
            renderCredits(); syncBal();
            toast('领到 2 分');
          }}})
        ])
      ])
    ]));
    function syncBal(){ balBox.querySelector('.stat-n').firstChild.textContent = String(S.state.credits.balance); }

    /* ---------- 4. 免费志愿咨询 ---------- */
    root.appendChild(el('section.sec', null, [
      el('h2.sec-h', { text:'免费咨询' }),
      row('每月免费志愿咨询',
          '每月有一批心理专业的志愿者和老师在固定时段提供免费咨询，限时限名额。' +
          '抢不到也不影响这里 —— 别把预约当成「只有那个才算数」。',
          el('button.btn', { text:'看本月名额', on:{ click: () => {
            toast('本月名额尚未开放，开放时会在设置页顶部提示');
          }}}))
    ]));

    /* ---------- 5. 客服 ---------- */
    const night = isNight();
    root.appendChild(el('section.sec', null, [
      el('h2.sec-h', { text:'客服' }),
      el('div.card', { style: 'border-color:' + (night ? 'rgba(200,121,74,.34)' : 'var(--hair-2)') }, [
        el('p', { style:'margin:0 0 9px; fontSize:14px', text:
          night ? '现在是夜间时段，有人值守' : '当前是白天时段' }),
        el('p', { style:'margin:0 0 15px; fontSize:13px; lineHeight:1.9; color:var(--ink-2)', text:
          '20:00 到次日 06:00 是情绪最容易涌上来的时段，这个时间段有真人客服在线，' +
          '不是机器人。白天的消息也会留档，会有人看到。\n' +
          '如果你正在经历危机，请直接打 12356（全国心理援助热线，24 小时）。' }),
        el('div.row-acts', null, [
          el('button.btn' + (night ? '.primary' : ''), { text: night ? '联系夜间客服' : '留言给客服',
            on:{ click: () => toast('客服通道尚未接入，第一版先留入口') } })
        ])
      ])
    ]));

    /* ---------- 6. 数据 ---------- */
    root.appendChild(el('section.sec', null, [
      el('h2.sec-h', { text:'你的数据' }),
      row('导出全部数据', '心事、记忆、对话记录，导出成一个 JSON 文件，存哪儿你自己决定。',
        el('button.btn', { text:'导出', on:{ click: exportAll } })),
      row('删除全部数据', '这件事没有撤销。导出之后再做。',
        el('button.btn', { text:'全部删除', on:{ click: () => {
          if(!confirm('会删掉全部心事、记忆和对话记录。确定吗？')) return;
          if(!confirm('再确认一次：删掉之后没有恢复的办法。')) return;
          S.wipeAll();
          toast('已全部删除');
          ctx.close();
        }}}))
    ]));

    /* 导出走本地 Blob，不经过服务器 —— 数据留在用户自己手上 */
    function exportAll(){
      const data = {
        exportedAt: new Date().toISOString(),
        diary:  S.state.diary,
        memory: S.state.memory,
        chat:   S.state.chat,
        credits:S.state.credits,
        course: S.state.course,
        settings: S.state.settings
      };
      try{
        const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = el('a', { href:url, download:'ufeel-' + new Date().toISOString().slice(0,10) + '.json' });
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast('已导出');
      }catch(e){
        console.error(e);
        toast('导出失败，浏览器可能禁用了下载');
      }
    }

    renderAge(); renderAgeNote();
    renderModel(); renderModelNote();
    renderCommunity();
    renderCredits();

    unsubs.push(S.on('credits', () => { renderCredits(); syncBal(); }));
    /* 涟漪开关的权威值在 store 里（ripple.js 订阅它来决定拦不拦 spawn）。
       这里跟着同步显示，避免出现「开关画着开、其实已经关了」。 */
    unsubs.push(S.on('settings', () => {
      rippleSw.classList.toggle('on', S.state.settings.ripples !== false);
    }));
  }

  function unmount(){
    unsubs.forEach(f => f());
    unsubs = [];
    if(bodyObs){ bodyObs.disconnect(); bodyObs = null; }
  }

  UFeel.pages.setting = {
    eyebrow: '设置',
    title: '把你的界限画在这里',
    note: '哪条能记、哪条不能，什么情况下有人真的会出现 —— 这些不该藏在默认值里由我们替你决定。',
    mount, unmount
  };
})();
</script>

<!-- 外壳：接管潮汐栏点击、浮层开合、hash 路由。必须最后加载。 -->
<script>
/* ============================================================================
   UFEEL · 外壳
   ----------------------------------------------------------------------------
   把原型的 6 个空按钮接上真正的板块，并负责浮层的开合。

   和水面渲染的分工：
     water.js 管「水怎么动」，本文件管「页面怎么来」。
     两者唯一的接触面是 #hot / #nav 的类名 —— water.js 的
     tideEnter()/tideExit() 照常按指针位置收放潮汐栏，本文件只在
     「有板块打开」时用 body.staged 把导航钉住，不去改它的逻辑。
   ========================================================================== */
(function(){
  'use strict';

  const { el, clear, toast } = UFeel;

  const stage     = document.getElementById('stage');
  const panel     = document.getElementById('panel');
  const navHandle = document.getElementById('navhandle');
  const homeBtn   = document.getElementById('home');
  const NAV       = ['review','diary','course','talk','memory','setting'];

  const CLOSE_MS = 420;            // 与 .panel 的 opacity .4s 对齐

  let current  = null;             // 当前板块 id
  let curMod   = null;             // 当前板块模块，用于 unmount
  let closeTimer = 0;

  /* 传给板块模块的上下文。板块只通过这些能力跟外面打交道，
     不直接碰 #stage / #panel，免得两个板块互相打架。 */
  const ctx = {
    el, toast,
    close,
    go: id => open(id)
  };

  /* ---- 页眉：所有板块共用同一套版式 ---- */
  function buildChrome(mod){
    clear(panel);
    /* 关闭按钮不在这里生成 —— 它是 index.html 里常驻的 #home。
       面板是滚动容器，放在这里的按钮会跟着内容滚走。 */
    panel.appendChild(el('header.ph', null, [
      mod.eyebrow ? el('p.ph-eyebrow', { text: mod.eyebrow }) : null,
      el('h1.ph-title', { text: mod.title || '' }),
      mod.note ? el('p.ph-note', { text: mod.note }) : null
    ]));
    const body = el('div.page-body');
    panel.appendChild(body);
    return body;
  }

  /* 改地址栏的 hash，纯粹是为了让 #talk 这种链接可以直接发给别人。
     🔴 必须包 try —— 用 file:// 双击打开时文档的 origin 是 null，
     Chrome 会直接对 replaceState 抛 SecurityError。不包的话
     open() 会在这一行中断，板块就再也打不开了，而单文件版正是这么用的。 */
  function setHash(h){
    try{ history.replaceState(null, '', h); }
    catch(e){ /* file:// 下正常，忽略；功能不依赖它 */ }
  }

  /* 折叠 / 展开潮汐栏。
     JS 只负责切一个 body 类，几何全部由 CSS 的 transform 表达 ——
     不参与动画，也就不会跟 water.js 每帧改写 #hot 宽度打架。 */
  const foldNav   = () => document.body.classList.add('nav-fold');
  const unfoldNav = () => document.body.classList.remove('nav-fold');

  function open(id){
    const mod = UFeel.pages[id];
    if(!mod) return;

    clearTimeout(closeTimer);

    /* 已经在看这个板块了 —— 这一下点击就当「把导航收回去」。
       否则用户展开导航看一眼、又不想换板块时，只能靠点别处收起来。 */
    if(current === id && !panel.hidden){ foldNav(); return; }

    unmountCurrent();
    current = id;

    document.body.classList.add('staged');
    foldNav();                                    // 选中即归位，不占着左侧
    stage.classList.add('open');
    if(location.hash.slice(1) !== id) setHash('#' + id);

    const body = buildChrome(mod);
    panel.hidden = false;
    panel.scrollTop = 0;
    void panel.offsetHeight;                      // 强制回流，否则 .in 的过渡不触发
    panel.classList.add('in');

    curMod = mod;
    try{
      mod.mount(body, ctx);
    }catch(e){
      /* 单个板块挂掉不该连累整页 —— 水面和导航必须还活着 */
      console.error('[UFeel] 板块挂载失败:', id, e);
      body.appendChild(el('p.empty', { text:'这个板块没能加载出来。换个板块试试，或者刷新页面。' }));
    }
  }

  function unmountCurrent(){
    if(curMod && curMod.unmount){
      try{ curMod.unmount(); }catch(e){ console.error(e); }
    }
    curMod = null;
  }

  function close(){
    if(panel.hidden) return;
    panel.classList.remove('in');
    clearTimeout(closeTimer);
    /* 用定时器而不是 transitionend：面板若被提前隐藏，transitionend 不会触发，
       监听会悬着，下次打开就会出现「关了又自己关一次」的怪状态。 */
    closeTimer = setTimeout(() => {
      panel.hidden = true;
      clear(panel);
      stage.classList.remove('open');
      document.body.classList.remove('staged');
      unfoldNav();
      current = null;
      unmountCurrent();
      setHash(location.pathname + location.search);
    }, CLOSE_MS);
  }

  /* ---- 接管潮汐栏 ---- */
  document.querySelectorAll('.nbtn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      open(btn.dataset.go);
    });
  });

  /* ---- 回到水面 ---- */
  homeBtn.addEventListener('click', close);

  /* ---- 点细片把手 ----
     两种情形共用这一个入口：
       · 板块开着（折叠态）→ 把潮汐栏原地展开；
       · 没开板块（触屏上的常驻入口）→ 让潮汐栏出现。
     第二种状态由 water.js 的 #hot.on 管，这里替它按一下。
     不能只靠「把手恰好位于左 1/4 屏、指针事件会顺带触发热区」这个巧合 ——
     那是布局的副作用，换个位置就悄悄失效了。 */
  navHandle.addEventListener('click', () => {
    unfoldNav();
    if(panel.hidden && typeof tideEnter === 'function') tideEnter();
  });

  /* ---- Esc 收起 ---- */
  addEventListener('keydown', e => {
    if(e.key !== 'Escape' || panel.hidden) return;
    /* 导航展开着的时候，Esc 先收导航 —— 用户的意图多半是「把这块收掉」，
       而不是「把整个板块关掉」。再按一次才关板块。 */
    if(document.body.classList.contains('nav-fold')) close();
    else foldNav();
  });

  /* ---- hash 路由：允许直接把 #talk 这样的链接发给别人 ---- */
  function fromHash(){
    const id = location.hash.slice(1);
    if(NAV.indexOf(id) >= 0) open(id);
  }
  addEventListener('hashchange', fromHash);

  /* 探活结果落到 body 上，样式和页面都能据此提示当前是不是本地演示模式。
     水面先跑起来，探活是后台的事，不阻塞首屏。 */
  UFeel.api.probe().then(ok => {
    document.body.classList.toggle('local-mode', !ok);
    if(!ok) console.info('[UFeel] 未连上后端，当前为本地演示模式。启动后端即可接真实模型。');
  });

  fromHash();

  /* 告诉看门狗：起来了。
     这一句放在最后 —— 能走到这里，说明水面画完了、六个板块注册完了、
     导航和按钮也接上了。前面任何一步抛错，它都不会执行，
     看门狗就会把「页面没能启动」显示出来。 */
  if(window.__UFEEL_BOOT__) window.__UFEEL_BOOT__();

  UFeel.shell = { open, close, get current(){ return current; } };
})();
</script>
</body>
</html>
